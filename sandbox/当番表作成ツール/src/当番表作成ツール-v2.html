<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当番表作成ツール</title>
<style>
/* === Stitch v2 デザイントークン適用版 === */
/* カラートークン（Stitch v2から抽出、プロジェクト固有名に変換） */
:root {
  --c-bg: #f7f9ff;          /* ページ背景 */
  --c-bg-subtle: #f1f4fa;   /* セクション背景 */
  --c-card: #ffffff;         /* カード・テーブル背景 */
  --c-card-hover: #ebeef4;  /* ホバー背景 */
  --c-text: #181c20;        /* 本文テキスト */
  --c-text-sub: #43474e;    /* 補助テキスト */
  --c-text-muted: #74777f;  /* 最薄テキスト */
  --c-accent: #001F3F;      /* メインアクセント（ダークネイビー） */
  --c-accent-light: #d4e3ff;/* アクセント薄 */
  --c-link: #2563EB;        /* リンク・アクティブ */
  --c-border: rgba(196,198,207,.3); /* ボーダー（ゴーストライン） */
  --c-border-solid: #c4c6cf;/* ボーダー実線 */
  --c-error: #ba1a1a;       /* エラー */
  --c-error-bg: #ffdad6;    /* エラー背景 */
  --c-success: #16A34A;     /* 成功 */
  --c-success-bg: #D1FAE5;  /* 成功背景 */
  --c-weekend-text: #74777f;/* 土日テキスト */
  --c-saturday: #2563EB;    /* 土曜色 */
  --c-sunday: #ba1a1a;      /* 日曜色 */
  --c-holiday-bg: #FFF7ED;  /* 祝日背景 */
  --c-holiday-text: #C2410C;/* 祝日テキスト */
  --shadow-sm: 0 1px 3px rgba(24,28,32,.06);
  --shadow-md: 0 4px 16px rgba(24,28,32,.08);
  --shadow-float: 0 12px 40px rgba(24,28,32,.06);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
}

/* === リセット・基本 === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Yu Gothic Medium", "Yu Gothic", "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
  background: var(--c-bg); color: var(--c-text); font-size: 14px; line-height: 1.7;
  font-weight: 400;
}
h1, h2, h3, h4 { font-weight: 700; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* === レイアウト === */
.app-header {
  background: linear-gradient(135deg, #000613, var(--c-accent)); color: #fff; padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.app-main { max-width: 1200px; margin: 0 auto; padding: 20px; }

/* === セクション（ボーダーレス・背景色差で分離） === */
.section { background: var(--c-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); margin-bottom: 16px; overflow: hidden; }
.section-header {
  background: var(--c-bg-subtle); padding: 12px 20px; cursor: pointer; display: flex;
  align-items: center; justify-content: space-between; user-select: none;
}
.section-header:hover { background: var(--c-card-hover); }
.section-header h2 { font-size: 15px; color: var(--c-accent); font-weight: 700; }
.section-toggle { font-size: 12px; color: var(--c-text-muted); transition: transform .2s; }
.section-toggle.collapsed { transform: rotate(-90deg); }
.section-body { padding: 20px; }
.section-body.collapsed { display: none; }

/* === タブ（Stitch v2スタイル: 下線アクセント） === */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--c-border); margin-bottom: 16px; background: var(--c-card); padding: 0 4px; }
.tab {
  padding: 12px 20px; cursor: pointer; border: none; background: none;
  font-size: 14px; color: var(--c-text-sub); border-bottom: 2px solid transparent;
  margin-bottom: -1px; transition: color .15s; font-weight: 500;
}
.tab:hover { color: var(--c-accent); }
.tab.active { color: var(--c-accent); border-bottom-color: var(--c-accent); font-weight: 700; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* === フォーム部品（Soft Tray スタイル） === */
.form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.form-label { font-size: 13px; color: var(--c-text-sub); min-width: 80px; font-weight: 500; }
.form-input, .form-select {
  padding: 8px 12px; border: 1px solid var(--c-border-solid); border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit; outline: none; background: var(--c-bg-subtle);
}
.form-input:focus, .form-select:focus { border-color: var(--c-accent); box-shadow: 0 0 0 2px rgba(0,31,63,.1); }
.form-input-sm { width: 100px; }
.form-input-md { width: 160px; }
.form-input-lg { width: 240px; }

/* === ボタン（グラデーションプライマリ + ゴーストセカンダリ） === */
.btn {
  padding: 7px 16px; border: none; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 13px; font-family: inherit; font-weight: 500; transition: background-color .15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: linear-gradient(135deg, #000613, var(--c-accent)); color: #fff; }
.btn-primary:hover { background: var(--c-accent); }
.btn-success { background: var(--c-success); color: #fff; }
.btn-success:hover { background: #15803D; }
.btn-danger { background: var(--c-error); color: #fff; }
.btn-danger:hover { background: #93000a; }
.btn-outline { background: var(--c-card); color: var(--c-accent); border: 1px solid var(--c-border-solid); }
.btn-outline:hover { background: var(--c-bg-subtle); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-lg { padding: 10px 24px; font-size: 14px; }

/* === カード（ボーダーレス・背景色差） === */
.card {
  border: none; border-radius: var(--radius-md); padding: 12px 16px;
  margin-bottom: 10px; background: var(--c-bg-subtle); transition: box-shadow .15s;
}
.card:hover { box-shadow: var(--shadow-sm); }
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-title { font-weight: 500; font-size: 14px; }
.card-actions { display: flex; gap: 4px; }
.card-body { margin-top: 8px; }

/* === タグバッジ === */
.tag-badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 500; color: #fff; margin: 1px 2px;
}
.tag-selector { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.tag-chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
  border-radius: 10px; font-size: 11px; cursor: pointer; border: 1px solid var(--c-border-solid);
  background: var(--c-card); transition: background-color .15s;
}
.tag-chip.selected { border-color: transparent; color: #fff; }
.tag-chip-remove { cursor: pointer; font-size: 14px; line-height: 1; opacity: .7; }
.tag-chip-remove:hover { opacity: 1; }

/* === ステータスバッジ === */
.status-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.status-badge {
  display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm);
  font-size: 11px; background: var(--c-card-hover); color: var(--c-text-sub);
}
.status-badge.short-time { background: #FEF3C7; color: #92400E; }
.status-badge.fixed-day { background: var(--c-accent-light); color: #1E40AF; }
.status-badge.day-off { background: #FCE7F3; color: #9D174D; }
.status-badge.unavailable { background: var(--c-error-bg); color: #991B1B; }
.status-badge.training { background: var(--c-success-bg); color: #065F46; }
.status-badge.exempt { background: var(--c-card-hover); color: var(--c-text-muted); }

/* === ミニカレンダー === */
.mini-cal { border-collapse: collapse; margin: 8px 0; }
.mini-cal th { padding: 4px 8px; font-size: 12px; color: var(--c-text-muted); font-weight: 500; text-align: center; }
.mini-cal td {
  padding: 6px; text-align: center; cursor: pointer; border-radius: var(--radius-sm);
  font-size: 13px; width: 38px; height: 34px; transition: background-color .1s;
}
.mini-cal td:hover { background: var(--c-accent-light); }
.mini-cal td.empty { cursor: default; }
.mini-cal td.weekend { color: var(--c-weekend-text); background: var(--c-bg-subtle); }
.mini-cal td.holiday { background: var(--c-error-bg); color: var(--c-error); font-weight: 700; }
.mini-cal td.workday-override { background: var(--c-success-bg); color: var(--c-success); font-weight: 700; }
.mini-cal td.today { outline: 2px solid var(--c-link); outline-offset: -1px; }

/* === 当番表グリッド（Stitch v2: ボーダーレステーブル + ゼブラストライプ） === */
.grid-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.grid-toolbar h2 { font-size: 16px; color: var(--c-accent); font-weight: 700; }
.grid-table-wrap { overflow-x: auto; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.grid-table { border-collapse: collapse; width: 100%; min-width: 500px; font-size: 13px; }
.grid-table th {
  padding: 10px 14px; background: var(--c-bg-subtle); color: var(--c-text-sub); font-weight: 500;
  text-align: center; white-space: nowrap; position: sticky; top: 0; z-index: 1;
  font-size: 12px; border-bottom: 1px solid var(--c-border);
}
.grid-table td {
  padding: 8px 12px; border-bottom: 1px solid var(--c-border); text-align: center;
  vertical-align: middle; min-width: 100px; background: var(--c-card);
}
.grid-table tr:nth-child(even) td { background: var(--c-bg); }
.grid-table tr:hover td { background: var(--c-accent-light); }
.grid-table tr.weekend td { background: var(--c-bg-subtle); color: var(--c-weekend-text); }
.grid-table tr.holiday td { background: var(--c-holiday-bg); color: var(--c-holiday-text); }
.grid-table td.day-col { min-width: 36px; font-weight: 700; }
.grid-table td.weekday-col { min-width: 30px; }
.grid-table td.slot-cell { cursor: pointer; min-height: 28px; }
.grid-table td.slot-cell:hover { background: var(--c-accent-light); }
.grid-table td.weekend-label { background: var(--c-bg-subtle); color: var(--c-weekend-text); font-size: 12px; font-style: italic; }

/* === チェックボックス付きステータス === */
.status-option { margin-bottom: 10px; }
.status-option-header { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.status-option-header input[type="checkbox"] { cursor: pointer; accent-color: var(--c-accent); }
.status-option-detail { margin: 6px 0 0 24px; padding: 10px 14px; background: var(--c-bg-subtle); border-radius: var(--radius-sm); border-left: 3px solid var(--c-accent); }
.weekday-checks { display: flex; gap: 2px; }
.weekday-check {
  width: 32px; height: 28px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--c-border-solid); border-radius: var(--radius-sm); cursor: pointer; font-size: 12px;
  background: var(--c-card); transition: background-color .15s; user-select: none;
}
.weekday-check.selected { background: var(--c-accent); color: #fff; border-color: var(--c-accent); }

/* === モーダル === */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(24,28,32,.4); z-index: 100;
  display: flex; align-items: center; justify-content: center;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--c-card); border-radius: var(--radius-xl); box-shadow: var(--shadow-float);
  width: 90%; max-width: 560px; max-height: 85vh; display: flex; flex-direction: column;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; border-bottom: 1px solid var(--c-border);
}
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--c-text-muted); padding: 4px; }
.modal-close:hover { color: var(--c-text); }
.modal-body { padding: 24px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--c-border); display: flex; justify-content: flex-end; gap: 8px; }

/* === 固定エントリーリスト === */
.fixed-entry { display: flex; align-items: center; gap: 6px; margin-top: 4px; padding: 6px 10px; background: var(--c-accent-light); border-radius: var(--radius-sm); font-size: 12px; }
.unavail-date-entry { display: flex; align-items: center; gap: 6px; margin-top: 4px; padding: 6px 10px; background: var(--c-error-bg); border-radius: var(--radius-sm); font-size: 12px; }

/* === 出力エリア === */
.output-section { display: flex; gap: 10px; flex-wrap: wrap; }

/* === 検索ボックス === */
.search-box { position: relative; margin-bottom: 12px; }
.search-input { width: 100%; padding: 10px 14px 10px 36px; border: 1px solid var(--c-border-solid); border-radius: var(--radius-md); font-size: 14px; outline: none; background: var(--c-bg-subtle); }
.search-input:focus { border-color: var(--c-accent); box-shadow: 0 0 0 2px rgba(0,31,63,.1); background: var(--c-card); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--c-text-muted); font-size: 14px; }
.staff-count { font-size: 12px; color: var(--c-text-muted); margin-bottom: 8px; }

/* === 通知 === */
.toast {
  position: fixed; bottom: 20px; right: 20px; padding: 12px 24px;
  background: var(--c-accent); color: #fff; border-radius: var(--radius-md); font-size: 13px;
  z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none;
  box-shadow: var(--shadow-md);
}
.toast.show { opacity: 1; }

/* === 印刷 === */
@media print {
  .app-header, #settings-panel, #output-section, .grid-toolbar .btn, .toast { display: none !important; }
  .app-main { max-width: none; padding: 0; }
  .section { box-shadow: none; }
  .grid-table { font-size: 11px; }
  .grid-table th { background: var(--c-bg-subtle) !important; color: var(--c-text) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .grid-table-wrap { box-shadow: none; }
  @page { size: A4 portrait; margin: 10mm; }
}
</style>
</head>
<body>

<header class="app-header">
  <h1>当番表作成ツール</h1>
</header>

<main class="app-main">
  <div id="settings-panel" class="section">
    <div class="section-header" id="settings-toggle">
      <h2>設定</h2>
      <span class="section-toggle" id="settings-toggle-icon">&#9660;</span>
    </div>
    <div class="section-body" id="settings-body">
      <div id="settings-tabs" class="tabs"></div>
      <div id="settings-content"></div>
    </div>
  </div>

  <div id="grid-section" class="section">
    <div class="section-body">
      <div class="grid-toolbar" id="grid-toolbar"></div>
      <div class="grid-table-wrap" id="grid-container"></div>
    </div>
  </div>

  <div id="output-section" class="section">
    <div class="section-body output-section" id="output-area"></div>
  </div>
</main>

<div id="modal-overlay" class="modal-overlay hidden"></div>
<div id="toast" class="toast"></div>
<footer style="text-align:center;padding:16px 20px;font-size:11px;color:#74777f;">本ツールは実験的に作成したものであり、本件成果物について一切責任を負わず、保守・運用も行いません。</footer>

<script>
(() => {
  'use strict';

  // ==========================================================
  // 定数
  // ==========================================================
  const STORAGE_KEY = 'toban_tool_data';
  const WEEKDAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];
  const TOAST_DURATION_MS = 2000;
  const MAX_REQUIRED_COUNT = 10;
  const SEARCH_BOX_THRESHOLD = 5;
  const STORAGE_WARNING_BYTES = 3 * 1024 * 1024; // 3MB で容量警告
  const MAX_UNDO_HISTORY = 15;
  const DEFAULT_TAG_COLORS = [
    '#2563EB', '#16A34A', '#DC2626', '#D97706', '#7C3AED',
    '#0891B2', '#BE185D', '#4F46E5', '#059669', '#EA580C',
  ];
  const SETTINGS_TABS = [
    { id: 'calendar', label: 'カレンダー' },
    { id: 'slots', label: '当番枠' },
    { id: 'tags', label: 'タグ' },
    { id: 'staff', label: '職員' },
    { id: 'neo', label: 'NEO連携' },
  ];

  // ==========================================================
  // ユーティリティ
  // ==========================================================
  function generateId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }

  function getDaysInMonth(year, month) {
    return new Date(year, month, 0).getDate();
  }

  function getDayOfWeek(year, month, day) {
    return new Date(year, month - 1, day).getDay();
  }

  function isWeekend(dayOfWeek) {
    return dayOfWeek === 0 || dayOfWeek === 6;
  }

  function formatDate(year, month, day) {
    const m = String(month).padStart(2, '0');
    const d = String(day).padStart(2, '0');
    return `${year}-${m}-${d}`;
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), TOAST_DURATION_MS);
  }

  // ==========================================================
  // データモデル
  // ==========================================================
  function createDefaultData() {
    const now = new Date();
    return {
      calendar: {
        year: now.getFullYear(),
        month: now.getMonth() + 1,
        holidays: [],       // 祝日として追加した日（day番号）
        workdayOverrides: [], // 土日だが勤務日にした日（day番号）
        dayTimeSettings: {}, // { day: 'full'|'am'|'pm' } デフォルトは'full'
      },
      slots: [
        { id: generateId(), name: '当番', startTime: '09:00', endTime: '17:00', requiredCount: 1, applyMode: 'workdays', specificDays: [], allowedTags: [] },
      ],
      tags: [],
      staff: [],
      assignments: {},
      neoIds: {},
    };
  }

  // ==========================================================
  // ストレージ
  // ==========================================================
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        // 後方互換: 新しいフィールドが無い場合のフォールバック
        const defaults = createDefaultData();
        return {
          calendar: { ...defaults.calendar, ...(data.calendar || {}) },
          slots: data.slots || defaults.slots,
          tags: data.tags || defaults.tags,
          staff: data.staff || defaults.staff,
          assignments: data.assignments || defaults.assignments,
          neoIds: data.neoIds || defaults.neoIds,
        };
      }
    } catch (e) {
      console.error('データの読み込みに失敗しました。初期データを使用します:', e);
      // 破損データを退避してから初期化する（次の保存で上書きされて復旧不能になるのを防ぐ）
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          localStorage.setItem(STORAGE_KEY + '_broken_backup', raw);
          alert('保存されていたデータが読み込めなかったため、初期状態で起動します。\n読み込めなかったデータはブラウザ内に退避してあります。\nJSONの控えがある場合は「出力」タブの「JSONインポート」から復元してください。');
        }
      } catch (e2) {
        console.error('破損データの退避に失敗しました:', e2);
      }
    }
    return createDefaultData();
  }

  function saveData() {
    try {
      const json = JSON.stringify(state);
      localStorage.setItem(STORAGE_KEY, json);
      // 容量警告
      if (json.length > STORAGE_WARNING_BYTES) {
        console.warn(`データサイズ: ${(json.length / 1024).toFixed(0)}KB — 上限に近づいています`);
        showToast(`データサイズが ${(json.length / 1024 / 1024).toFixed(1)}MB です。JSONエクスポートでバックアップを推奨します`);
      }
    } catch (e) {
      console.error('データの保存に失敗しました:', e);
      alert('保存に失敗しました。ブラウザの容量上限に達した可能性があります。\n\n「JSONエクスポート」でデータを退避してから、不要な月のデータを削除してください。');
    }
  }

  /** Undo用にスナップショットを保存 */
  function pushUndo() {
    undoHistory.push(JSON.stringify(state.assignments));
    if (undoHistory.length > MAX_UNDO_HISTORY) undoHistory.shift();
  }

  // オーバーレイクリックでモーダルを閉じる際の確認文（nullなら確認なしで閉じる）。
  // 未保存の編集内容を持つモーダルが誤クリックで無言破棄されるのを防ぐ
  let modalCloseGuard = null;

  // ==========================================================
  // 状態
  // ==========================================================
  let state = loadData();
  let activeTab = 'calendar';
  let staffSearchQuery = '';
  let undoHistory = [];

  // ==========================================================
  // DOM ヘルパー
  // ==========================================================
  function clearElement(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function el(tag, className) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    return element;
  }

  function textEl(tag, className, text) {
    const element = el(tag, className);
    element.textContent = text;
    return element;
  }

  function createButton(text, className, onClick) {
    const btn = textEl('button', 'btn ' + (className || ''), text);
    btn.addEventListener('click', onClick);
    return btn;
  }

  function createInput(type, value, className, placeholder) {
    const input = el('input', className || '');
    input.type = type;
    if (value !== undefined && value !== null) input.value = value;
    if (placeholder) input.placeholder = placeholder;
    return input;
  }

  function createSelect(options, selectedValue, className) {
    const select = el('select', 'form-select ' + (className || ''));
    for (const opt of options) {
      const option = textEl('option', '', opt.label);
      option.value = opt.value;
      if (String(opt.value) === String(selectedValue)) option.selected = true;
      select.appendChild(option);
    }
    return select;
  }

  function appendChildren(parent, children) {
    for (const child of children) {
      if (child) parent.appendChild(child);
    }
  }

  function renderMiniCalendar() {
    const { year, month, holidays, workdayOverrides } = state.calendar;
    const daysInMonth = getDaysInMonth(year, month);
    const firstDow = getDayOfWeek(year, month, 1);
    const today = new Date();

    const table = el('table', 'mini-cal');
    const thead = el('thead');
    const headRow = el('tr');
    for (const name of WEEKDAY_NAMES) {
      headRow.appendChild(textEl('th', '', name));
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = el('tbody');
    let dayNum = 1;
    const totalCells = Math.ceil((daysInMonth + firstDow) / 7) * 7;

    let row;
    for (let i = 0; i < totalCells; i++) {
      if (i % 7 === 0) {
        row = el('tr');
      }

      const td = el('td');
      if (i < firstDow || dayNum > daysInMonth) {
        td.className = 'empty';
      } else {
        const currentDay = dayNum;
        const dow = getDayOfWeek(year, month, currentDay);
        td.textContent = String(currentDay);

        if (holidays.includes(currentDay)) {
          td.className = 'holiday';
          td.title = '祝日（クリックで解除）';
        } else if (workdayOverrides.includes(currentDay)) {
          td.className = 'workday-override';
          td.title = '勤務日に変更済み（クリックで解除）';
        } else if (isWeekend(dow)) {
          td.className = 'weekend';
          td.title = '土日（クリックで勤務日に変更）';
        }

        // 今日の日付をハイライト
        if (year === today.getFullYear() && month === today.getMonth() + 1 && currentDay === today.getDate()) {
          td.classList.add('today');
        }

        td.addEventListener('click', () => {
          toggleDayStatus(currentDay, dow);
        });

        dayNum++;
      }

      row.appendChild(td);
      if (i % 7 === 6) {
        tbody.appendChild(row);
      }
    }
    table.appendChild(tbody);
    return table;
  }

  function toggleDayStatus(day, dow) {
    const { holidays, workdayOverrides } = state.calendar;

    if (holidays.includes(day)) {
      // 祝日 → 解除（通常に戻す）
      state.calendar.holidays = holidays.filter(d => d !== day);
    } else if (workdayOverrides.includes(day)) {
      // 勤務日変更 → 解除（土日に戻す）
      state.calendar.workdayOverrides = workdayOverrides.filter(d => d !== day);
    } else if (isWeekend(dow)) {
      // 土日 → 勤務日に変更
      state.calendar.workdayOverrides.push(day);
    } else {
      // 平日 → 祝日に設定
      state.calendar.holidays.push(day);
    }

    saveData();
    renderActiveTab();
    renderGrid();
  }

  /** 指定日が休日（当番なし）かどうか */
  function isDayOff(day) {
    const dow = getDayOfWeek(state.calendar.year, state.calendar.month, day);
    if (state.calendar.holidays.includes(day)) return true;
    if (state.calendar.workdayOverrides.includes(day)) return false;
    return isWeekend(dow);
  }

  /** 日の時間帯設定を取得（'full', 'am', 'pm'） */
  function getDayTimeSetting(day) {
    const settings = state.calendar.dayTimeSettings || {};
    return settings[day] || 'full';
  }

  /** スロットがその日に有効かどうか（適用日モード + 時間帯設定） */
  function isSlotActiveForDay(slot, day) {
    const mode = slot.applyMode || 'workdays';

    if (mode === 'specific') {
      // 日付指定モード: specificDays に含まれている日のみ有効
      if (!(slot.specificDays || []).includes(day)) return false;
    } else {
      // 平日すべてモード: 従来通り isDayOff で判定
      if (isDayOff(day)) return false;
    }

    // 時間帯設定との重なりチェック
    const setting = getDayTimeSetting(day);
    if (setting === 'full') return true;
    const AM_END = '12:00';
    const PM_START = '12:00';
    if (setting === 'am') return isTimeOverlap(slot.startTime, slot.endTime, '00:00', AM_END);
    if (setting === 'pm') return isTimeOverlap(slot.startTime, slot.endTime, PM_START, '23:59');
    return true;
  }

  /** その日にアクティブな枠が1つでもあるか */
  function hasAnyActiveSlot(day) {
    return state.slots.some(slot => isSlotActiveForDay(slot, day));
  }

  // ==========================================================

  function renderSlotCard(slot) {
    const card = el('div', 'card');
    const cardHeader = el('div', 'card-header');

    // 枠名入力
    const nameInput = createInput('text', slot.name, 'form-input form-input-md');
    nameInput.addEventListener('change', () => {
      slot.name = nameInput.value.trim() || '当番';
      saveData();
      renderGrid();
    });
    cardHeader.appendChild(nameInput);

    // 削除ボタン
    const actions = el('div', 'card-actions');
    actions.appendChild(createButton('削除', 'btn-sm btn-danger', () => {
      if (state.slots.length <= 1) {
        showToast('最低1つの枠が必要です');
        return;
      }
      if (!confirm(`枠「${slot.name}」を削除しますか？\nこの枠の割り当てと、この枠への曜日固定設定も削除されます。`)) return;
      state.slots = state.slots.filter(s => s.id !== slot.id);
      // この枠を参照する曜日固定・割り当てを掃除する（削除済み枠IDへの参照残置防止）
      for (const s of state.staff) {
        if (s.fixedDays) s.fixedDays = s.fixedDays.filter(fd => fd.slotId !== slot.id);
      }
      for (const dateKey of Object.keys(state.assignments)) {
        delete state.assignments[dateKey][slot.id];
      }
      saveData();
      renderActiveTab();
      renderGrid();
    }));
    cardHeader.appendChild(actions);
    card.appendChild(cardHeader);

    // 詳細設定
    const body = el('div', 'card-body');
    const timeRow = el('div', 'form-row');
    timeRow.appendChild(textEl('span', 'form-label', '時間'));

    const startInput = createInput('time', slot.startTime, 'form-input form-input-sm');
    startInput.addEventListener('change', () => {
      slot.startTime = startInput.value;
      saveData();
    });
    timeRow.appendChild(startInput);

    timeRow.appendChild(textEl('span', '', '〜'));

    const endInput = createInput('time', slot.endTime, 'form-input form-input-sm');
    endInput.addEventListener('change', () => {
      slot.endTime = endInput.value;
      saveData();
    });
    timeRow.appendChild(endInput);
    body.appendChild(timeRow);

    const countRow = el('div', 'form-row');
    countRow.appendChild(textEl('span', 'form-label', '必要人数'));
    const countInput = createInput('number', slot.requiredCount, 'form-input form-input-sm');
    countInput.min = '1';
    countInput.max = String(MAX_REQUIRED_COUNT);
    countInput.addEventListener('change', () => {
      slot.requiredCount = Math.max(1, parseInt(countInput.value, 10) || 1);
      countInput.value = slot.requiredCount;
      saveData();
      renderGrid();
    });
    countRow.appendChild(countInput);
    countRow.appendChild(textEl('span', '', '人'));
    body.appendChild(countRow);

    // 適用日設定
    const applyRow = el('div', 'form-row');
    applyRow.appendChild(textEl('span', 'form-label', '適用日'));
    const applyMode = slot.applyMode || 'workdays';
    const applySelect = createSelect([
      { value: 'workdays', label: '平日すべて' },
      { value: 'specific', label: '日付を指定' },
    ], applyMode);
    applySelect.addEventListener('change', () => {
      slot.applyMode = applySelect.value;
      if (slot.applyMode === 'workdays') slot.specificDays = [];
      saveData();
      renderActiveTab();
      renderGrid();
    });
    applyRow.appendChild(applySelect);
    body.appendChild(applyRow);

    // 対象タグ（タグが登録されている場合のみ表示）
    if (state.tags.length > 0) {
      const tagRow = el('div', 'form-row');
      tagRow.style.alignItems = 'flex-start';
      tagRow.appendChild(textEl('span', 'form-label', '対象'));
      const tagWrap = el('div');
      if (!slot.allowedTags) slot.allowedTags = [];
      const hasFilter = slot.allowedTags.length > 0;

      const tagHint = textEl('span', '', hasFilter ? '' : '全員');
      tagHint.style.fontSize = '12px';
      tagHint.style.color = '#6B7280';
      tagHint.style.marginRight = '8px';
      tagWrap.appendChild(tagHint);

      const tagSelector = el('div', 'tag-selector');
      tagSelector.style.marginTop = '2px';
      for (const tag of state.tags) {
        const isSelected = slot.allowedTags.includes(tag.id);
        const chip = textEl('span', 'tag-chip' + (isSelected ? ' selected' : ''), tag.name);
        if (isSelected) {
          chip.style.backgroundColor = tag.color;
          chip.style.borderColor = tag.color;
        }
        const tagId = tag.id;
        chip.addEventListener('click', () => {
          if (!slot.allowedTags) slot.allowedTags = [];
          if (slot.allowedTags.includes(tagId)) {
            slot.allowedTags = slot.allowedTags.filter(t => t !== tagId);
          } else {
            slot.allowedTags.push(tagId);
          }
          saveData();
          renderActiveTab();
          renderGrid();
        });
        tagSelector.appendChild(chip);
      }
      tagWrap.appendChild(tagSelector);
      tagRow.appendChild(tagWrap);
      body.appendChild(tagRow);
    }

    // 日付指定モードのミニカレンダー
    if (applyMode === 'specific') {
      if (!slot.specificDays) slot.specificDays = [];
      const calWrap = el('div');
      calWrap.style.marginTop = '8px';

      const selectedInfo = textEl('p', '', `選択中: ${slot.specificDays.length}日`);
      selectedInfo.style.fontSize = '12px';
      selectedInfo.style.color = '#6B7280';
      calWrap.appendChild(selectedInfo);

      const cal = renderSlotMiniCalendar(slot);
      calWrap.appendChild(cal);

      // 選択済み日付のリスト表示
      if (slot.specificDays.length > 0) {
        const daysList = el('div');
        daysList.style.marginTop = '4px';
        const sorted = [...slot.specificDays].sort((a, b) => a - b);
        for (const d of sorted) {

          const entry = el('div', 'fixed-entry');

            slot.specificDays = slot.specificDays.filter(x => x !== dayToRemove);
            saveData();
            renderActiveTab();
            renderGrid();
          }));
          daysList.appendChild(entry);
        }
        calWrap.appendChild(daysList);
      }

      body.appendChild(calWrap);
    }

    card.appendChild(body);
    return card;
  }

  /** 枠の適用日選択用ミニカレンダー */
  function renderSlotMiniCalendar(slot) {
    const { year, month } = state.calendar;
    const daysInMonth = getDaysInMonth(year, month);
    const firstDow = getDayOfWeek(year, month, 1);

    const table = el('table', 'mini-cal');

    const totalCells = Math.ceil((daysInMonth + firstDow) / 7) * 7;

    let row;
    for (let i = 0; i < totalCells; i++) {
