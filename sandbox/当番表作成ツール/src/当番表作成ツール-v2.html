    let filtered = state.staff;
    if (staffSearchQuery) {
      const q = staffSearchQuery.toLowerCase();
      filtered = state.staff.filter(s => {
        if (s.name.toLowerCase().includes(q)) return true;
        const staffTags = (s.tags || []).map(tid => {
          const t = state.tags.find(tag => tag.id === tid);
          return t ? t.name.toLowerCase() : '';
        });
        return staffTags.some(name => name.includes(q));
      });
    }

    if (filtered.length === 0 && state.staff.length > 0) {
      container.appendChild(textEl('p', 'staff-count', '該当する職員が見つかりません'));
      return;
    }
    if (state.staff.length === 0) {
      const hint = textEl('p', '', '「職員を追加」から職員を登録してください。');
      hint.style.color = '#6B7280';
      container.appendChild(hint);
      return;
    }

    container.appendChild(textEl('p', 'staff-count', `表示: ${filtered.length}/${state.staff.length}人`));

    for (const s of filtered) {
      container.appendChild(renderStaffCard(s));
    }
  }

  function renderStaffCard(staff) {
    const card = el('div', 'card');
    const cardHeader = el('div', 'card-header');

    // 名前
    const nameArea = el('div');
    nameArea.appendChild(textEl('span', 'card-title', staff.name));

    // タグバッジ
    const tagsArea = el('span');
    for (const tid of (staff.tags || [])) {
      const tag = state.tags.find(t => t.id === tid);
      if (tag) {
        const badge = textEl('span', 'tag-badge', tag.name);
        badge.style.backgroundColor = tag.color;
        tagsArea.appendChild(badge);
      }
    }
    nameArea.appendChild(tagsArea);
    cardHeader.appendChild(nameArea);

    // アクション
    const actions = el('div', 'card-actions');
    actions.appendChild(createButton('編集', 'btn-sm btn-outline', () => openStaffModal(staff)));
    actions.appendChild(createButton('削除', 'btn-sm btn-danger', () => {
      if (!confirm(`「${staff.name}」さんを削除しますか？\n当番表の割り当てからも外れます。`)) return;
      state.staff = state.staff.filter(s => s.id !== staff.id);
      // ペア参照を解除
      for (const s of state.staff) {
        if (s.trainingPairId === staff.id) s.trainingPairId = null;
      }
      // 割り当て済みのセルからも除去する（削除済み職員IDへの参照残置防止）
      for (const dateKey of Object.keys(state.assignments)) {
        for (const slotId of Object.keys(state.assignments[dateKey])) {
          state.assignments[dateKey][slotId] = state.assignments[dateKey][slotId].filter(id => id !== staff.id);
        }
      }
      saveData();
      renderActiveTab();
      renderGrid();
    }));
    cardHeader.appendChild(actions);
    card.appendChild(cardHeader);

    // ステータスバッジ
    const badges = el('div', 'status-badges');
    const statuses = getStaffStatusSummary(staff);
    if (statuses.length === 0) {
      badges.appendChild(textEl('span', 'status-badge', '通常'));
    }
    for (const s of statuses) {
      badges.appendChild(textEl('span', 'status-badge ' + s.className, s.label));
    }
    card.appendChild(badges);

    return card;
  }

  function getStaffStatusSummary(staff) {
    const result = [];
    // 当番頻度
    const w = staff.dutyWeight ?? 1;
    if (w === 0) result.push({ label: '当番なし', className: 'unavailable' });
    else if (w >= 2) result.push({ label: '当番できるだけ', className: 'fixed-day' });
    else if (w > 1) result.push({ label: '当番多め', className: 'fixed-day' });
    else if (w < 1) result.push({ label: '当番少なめ', className: 'day-off' });
    if (staff.shortTime) {
      result.push({ label: `時短（${staff.shortTime.start}〜${staff.shortTime.end}）`, className: 'short-time' });
    }
    if (staff.fixedDays && staff.fixedDays.length > 0) {
      for (const fd of staff.fixedDays) {
        const slotObj = state.slots.find(s => s.id === fd.slotId);
        const slotName = slotObj ? slotObj.name : '?';
        const days = fd.weekdays.map(d => WEEKDAY_NAMES[d]).join('');
        result.push({ label: `固定: ${slotName}・${days}`, className: 'fixed-day' });
      }
    }
    // 不可日（曜日+日付を統合表示）
    const unavailParts = [];
    if (staff.dayOffWeekdays && staff.dayOffWeekdays.length > 0) {
      unavailParts.push(`毎週${staff.dayOffWeekdays.map(d => WEEKDAY_NAMES[d]).join('')}`);
    }
    if (staff.unavailableDates && staff.unavailableDates.length > 0) {
      unavailParts.push(`${staff.unavailableDates.length}日`);
    }
    if (unavailParts.length > 0) {
      result.push({ label: `不可: ${unavailParts.join(' + ')}`, className: 'unavailable' });
    }
    if (staff.trainingPairId) {
      const pair = state.staff.find(s => s.id === staff.trainingPairId);
      const pairName = pair ? pair.name : '?';
      const modeLabel = (staff.pairSlotMode === 'single') ? '1枠' : '2枠';
      result.push({ label: `研修ペア: ${pairName}（${modeLabel}）`, className: 'training' });
    }
    if (staff.exemptFromDate) {
      result.push({ label: `対象外: ${staff.exemptFromDate}〜`, className: 'exempt' });
    }
    return result;
  }

  // ==========================================================
  // 職員一括登録モーダル
  // ==========================================================
  function openBulkStaffModal() {
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('hidden');
    clearElement(overlay);

    const modal = el('div', 'modal');

    // ヘッダー
    const header = el('div', 'modal-header');
    header.appendChild(textEl('h3', '', '職員の一括登録'));
    const closeBtn = textEl('button', 'modal-close', '\u00d7');
    closeBtn.addEventListener('click', closeModal);
    header.appendChild(closeBtn);
    modal.appendChild(header);

    // ボディ
    const body = el('div', 'modal-body');

    const hint = textEl('p', '', '職員名を1行に1人ずつ入力してください。Excelからの貼り付けにも対応しています。');
    hint.style.fontSize = '13px';
    hint.style.color = '#6B7280';
    hint.style.marginBottom = '8px';
    body.appendChild(hint);

    const textarea = el('textarea', 'form-input');
    textarea.style.width = '100%';
    textarea.style.height = '200px';
    textarea.style.resize = 'vertical';
    textarea.style.fontFamily = 'inherit';
    textarea.style.fontSize = '14px';
    textarea.placeholder = '山田太郎\n佐藤花子\n鈴木一郎\n...';
    body.appendChild(textarea);

    // 既存職員との重複チェック表示用
    const previewArea = el('div');
    previewArea.style.marginTop = '8px';
    body.appendChild(previewArea);

    // 入力時にプレビュー更新
    textarea.addEventListener('input', () => {
      clearElement(previewArea);
      const names = parseBulkNames(textarea.value);
      if (names.length === 0) return;

      const existingNames = new Set(state.staff.map(s => s.name));
      const duplicates = names.filter(n => existingNames.has(n));
      const newNames = names.filter(n => !existingNames.has(n));

      const info = textEl('p', '', `新規: ${newNames.length}人`);
      info.style.fontSize = '13px';
      info.style.color = '#059669';
      previewArea.appendChild(info);

      if (duplicates.length > 0) {
        const warn = textEl('p', '', `既に登録済み（スキップ）: ${duplicates.length}人（${duplicates.join('、')}）`);
        warn.style.fontSize = '12px';
        warn.style.color = '#D97706';
        previewArea.appendChild(warn);
      }
    });

    modal.appendChild(body);

    // フッター
    const footer = el('div', 'modal-footer');
    footer.appendChild(createButton('キャンセル', 'btn-outline', closeModal));
    footer.appendChild(createButton('登録', 'btn-primary', () => {
      const names = parseBulkNames(textarea.value);
      if (names.length === 0) {
        showToast('名前を入力してください');
        return;
      }

      const existingNames = new Set(state.staff.map(s => s.name));
      let addedCount = 0;
      for (const name of names) {
        if (existingNames.has(name)) continue;
        state.staff.push({
          id: generateId(),
          name: name,
          dutyWeight: 1,
          shortTime: null,
          fixedDays: [],
          dayOffWeekdays: [],
          unavailableDates: [],
          trainingPairId: null,
          exemptFromDate: null,
          tags: [],
        });
        existingNames.add(name);
        addedCount++;
      }

      saveData();
      closeModal();
      renderActiveTab();
      renderGrid();
      showToast(`${addedCount}人を登録しました`);
    }));
    modal.appendChild(footer);

    overlay.appendChild(modal);
  }

  /** テキストから職員名リストをパース（空行・空白除去、重複除去） */
  function parseBulkNames(text) {
    return [...new Set(
      text.split(/[\n\r]+/)
        .map(line => line.trim())
        .filter(line => line.length > 0)
    )];
  }

  // ==========================================================
  // 職員編集モーダル
  // ==========================================================
  function openStaffModal(existingStaff) {
    const isNew = !existingStaff;
    const draft = existingStaff
      ? JSON.parse(JSON.stringify(existingStaff))
      : {
          id: generateId(),
          name: '',
          dutyWeight: 1,
          shortTime: null,
          fixedDays: [],
          dayOffWeekdays: [],
          unavailableDates: [],
          trainingPairId: null,
          exemptFromDate: null,
          tags: [],
        };

    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('hidden');
    clearElement(overlay);

    // 編集途中の誤クリック（背景クリック）による無言破棄を防ぐ
    modalCloseGuard = '編集内容は保存されていません。保存せずに閉じますか？';

    const modal = el('div', 'modal');

    // ヘッダー
    const header = el('div', 'modal-header');
    header.appendChild(textEl('h3', '', isNew ? '職員の追加' : '職員の編集'));
    const closeBtn = textEl('button', 'modal-close', '\u00d7');
    closeBtn.addEventListener('click', closeModal);
    header.appendChild(closeBtn);
    modal.appendChild(header);

    // ボディ
    const body = el('div', 'modal-body');
    renderStaffForm(body, draft);
    modal.appendChild(body);

    // フッター
    const footer = el('div', 'modal-footer');
    footer.appendChild(createButton('キャンセル', 'btn-outline', closeModal));
    footer.appendChild(createButton(isNew ? '追加' : '保存', 'btn-primary', () => {
      if (!draft.name.trim()) {
        showToast('名前を入力してください');
        return;
      }
      draft.name = draft.name.trim();

      // 一時的な展開フラグを除去
      for (const key of Object.keys(draft)) {
        if (key.startsWith('_')) delete draft[key];
      }

      if (isNew) {
        state.staff.push(draft);
      } else {
        const idx = state.staff.findIndex(s => s.id === draft.id);
        if (idx >= 0) state.staff[idx] = draft;
      }

      // ペアの双方向整合性を保証
      syncTrainingPair(draft);

      saveData();
      closeModal();
      renderActiveTab();
      renderGrid();
    }));
    modal.appendChild(footer);

    overlay.appendChild(modal);
  }

  /** ペア設定の双方向整合性を保証する */
  function syncTrainingPair(staff) {
    // 旧ペア相手のリンクを解除
    for (const s of state.staff) {
      if (s.id !== staff.id && s.trainingPairId === staff.id) {
        if (staff.trainingPairId !== s.id) {
          s.trainingPairId = null;
        }
      }
    }
    // 新ペア相手に逆リンクを設定（pairSlotModeも同期）
    if (staff.trainingPairId) {
      const pair = state.staff.find(s => s.id === staff.trainingPairId);
      if (pair) {
        pair.trainingPairId = staff.id;
        pair.pairSlotMode = staff.pairSlotMode || 'double';
      }
    }
  }

  function closeModal() {
    modalCloseGuard = null;
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.add('hidden');
    clearElement(overlay);
  }

  function renderStaffForm(container, draft) {
    // 名前
    const nameRow = el('div', 'form-row');
    nameRow.appendChild(textEl('span', 'form-label', '名前'));
    const nameInput = createInput('text', draft.name, 'form-input form-input-lg', '例：山田太郎');
    nameInput.addEventListener('input', () => { draft.name = nameInput.value; });
    nameRow.appendChild(nameInput);
    container.appendChild(nameRow);

    // 当番頻度
    const weightRow = el('div', 'form-row');
    weightRow.appendChild(textEl('span', 'form-label', '当番頻度'));
    const weightOptions = [
      { value: '2', label: 'できるだけ入れる（2倍）' },
      { value: '1.5', label: '多め（1.5倍）' },
      { value: '1', label: '通常' },
      { value: '0.5', label: '少なめ（0.5倍）' },
      { value: '0', label: '出さない' },
    ];
    const weightSelect = createSelect(weightOptions, String(draft.dutyWeight ?? 1));
    weightSelect.addEventListener('change', () => {
      draft.dutyWeight = parseFloat(weightSelect.value);
    });
    weightRow.appendChild(weightSelect);
    container.appendChild(weightRow);

    container.appendChild(textEl('h4', '', 'ステータス設定'));
    const statusHint = textEl('p', '', '該当するものにチェックを入れてください。複数選択できます。');
    statusHint.style.fontSize = '12px';
    statusHint.style.color = '#6B7280';
    statusHint.style.marginBottom = '8px';
    container.appendChild(statusHint);

    // 時短勤務
    renderShortTimeOption(container, draft);
    // 曜日固定
    renderFixedDayOption(container, draft);
    // 不可日（曜日指定 + 日付指定を統合）
    renderUnavailableDaysOption(container, draft);
    // 研修ペア
    renderTrainingOption(container, draft);
    // 対象外
    renderExemptOption(container, draft);

    // タグ
    if (state.tags.length > 0) {
      container.appendChild(textEl('h4', '', 'タグ'));
      const tagSelector = el('div', 'tag-selector');
      for (const tag of state.tags) {
        const isSelected = (draft.tags || []).includes(tag.id);
        const chip = textEl('span', 'tag-chip' + (isSelected ? ' selected' : ''), tag.name);
        if (isSelected) {
          chip.style.backgroundColor = tag.color;
          chip.style.borderColor = tag.color;
        }
        chip.addEventListener('click', () => {
          if (!draft.tags) draft.tags = [];
          if (draft.tags.includes(tag.id)) {
            draft.tags = draft.tags.filter(t => t !== tag.id);
          } else {
            draft.tags.push(tag.id);
          }
          // 再描画
          clearElement(container);
          renderStaffForm(container, draft);
        });
        tagSelector.appendChild(chip);
      }
      container.appendChild(tagSelector);
    }
  }

  function renderShortTimeOption(container, draft) {
    const option = el('div', 'status-option');
    const header = el('label', 'status-option-header');
    const cb = createInput('checkbox', null, '');
    cb.checked = !!draft.shortTime;
    header.appendChild(cb);
    header.appendChild(textEl('span', '', '時短勤務（勤務時間帯を指定）'));
    option.appendChild(header);

    if (draft.shortTime) {
      const detail = el('div', 'status-option-detail');
      const row = el('div', 'form-row');
      row.appendChild(textEl('span', '', '勤務時間'));

      const startInput = createInput('time', draft.shortTime.start, 'form-input form-input-sm');
      startInput.addEventListener('change', () => { draft.shortTime.start = startInput.value; });
      row.appendChild(startInput);

      row.appendChild(textEl('span', '', '〜'));

      const endInput = createInput('time', draft.shortTime.end, 'form-input form-input-sm');
      endInput.addEventListener('change', () => { draft.shortTime.end = endInput.value; });
      row.appendChild(endInput);

      detail.appendChild(row);
      option.appendChild(detail);
    }

    cb.addEventListener('change', () => {
      draft.shortTime = cb.checked ? { start: '09:00', end: '13:00' } : null;
      clearElement(container);
      renderStaffForm(container, draft);
    });

    container.appendChild(option);
  }

  function renderFixedDayOption(container, draft) {
    const option = el('div', 'status-option');
    const header = el('label', 'status-option-header');
    const hasFixed = (draft.fixedDays && draft.fixedDays.length > 0) || draft._showFixedDays;
    const cb = createInput('checkbox', null, '');
    cb.checked = hasFixed;
    header.appendChild(cb);
    header.appendChild(textEl('span', '', '曜日固定（指定した枠×曜日に確定）'));
    option.appendChild(header);

    if (hasFixed) {
      const detail = el('div', 'status-option-detail');

      // 既存エントリー表示
      for (let i = 0; i < draft.fixedDays.length; i++) {
        const fd = draft.fixedDays[i];
        const entry = el('div', 'fixed-entry');
        const slotObj = state.slots.find(s => s.id === fd.slotId);
        const slotName = slotObj ? slotObj.name : '（削除された枠）';
        const days = fd.weekdays.map(d => WEEKDAY_NAMES[d]).join('・');
        entry.appendChild(textEl('span', '', `${slotName} ― ${days}`));
        const idx = i;
        entry.appendChild(createButton('削除', 'btn-sm btn-danger', () => {
          draft.fixedDays.splice(idx, 1);
          clearElement(container);
          renderStaffForm(container, draft);
        }));
        detail.appendChild(entry);
      }

      // 新規追加フォーム
      const addRow = el('div', 'form-row');
      addRow.style.marginTop = '8px';

      const slotOptions = state.slots.map(s => ({ value: s.id, label: s.name }));
      const slotSelect = createSelect(slotOptions, slotOptions[0]?.value || '');
      addRow.appendChild(slotSelect);

      const weekdayState = [false, false, false, false, false, false, false];
      const weekdayChecks = el('div', 'weekday-checks');
      for (let d = 1; d <= 5; d++) { // 月〜金のみ
        const check = textEl('span', 'weekday-check', WEEKDAY_NAMES[d]);
        const dayIdx = d;
        check.addEventListener('click', () => {
          weekdayState[dayIdx] = !weekdayState[dayIdx];
          check.classList.toggle('selected');
        });
        weekdayChecks.appendChild(check);
      }
      addRow.appendChild(weekdayChecks);

      addRow.appendChild(createButton('追加', 'btn-sm btn-primary', () => {
        const selectedDays = weekdayState.reduce((acc, v, i) => { if (v) acc.push(i); return acc; }, []);
        if (selectedDays.length === 0) {
          showToast('曜日を選択してください');
          return;
        }
        draft.fixedDays.push({ slotId: slotSelect.value, weekdays: selectedDays });
        clearElement(container);
        renderStaffForm(container, draft);
      }));

      detail.appendChild(addRow);
      option.appendChild(detail);
    }

    cb.addEventListener('change', () => {
      if (!cb.checked) {
        draft.fixedDays = [];
        delete draft._showFixedDays;
      } else {
        draft._showFixedDays = true;
      }
      clearElement(container);
      renderStaffForm(container, draft);
    });

    container.appendChild(option);
  }

  function renderUnavailableDaysOption(container, draft) {
    const option = el('div', 'status-option');
    const header = el('label', 'status-option-header');
    const hasDayOff = draft.dayOffWeekdays && draft.dayOffWeekdays.length > 0;
    const hasUnavail = draft.unavailableDates && draft.unavailableDates.length > 0;
    const isExpanded = hasDayOff || hasUnavail || draft._showUnavailDays;
    const cb = createInput('checkbox', null, '');
    cb.checked = isExpanded;
    header.appendChild(cb);
    header.appendChild(textEl('span', '', '不可日あり（出勤できない曜日・日付を指定）'));
    option.appendChild(header);

    if (isExpanded) {
      const detail = el('div', 'status-option-detail');

      // --- 曜日で指定 ---
      detail.appendChild(textEl('p', '', '毎週の公休曜日'));
      const dowRow = el('div', 'form-row');
      const weekdayChecks = el('div', 'weekday-checks');
      for (let d = 0; d < 7; d++) {
        const check = textEl('span', 'weekday-check' + ((draft.dayOffWeekdays || []).includes(d) ? ' selected' : ''), WEEKDAY_NAMES[d]);
        const dayIdx = d;
        check.addEventListener('click', () => {
          if (!draft.dayOffWeekdays) draft.dayOffWeekdays = [];
          if (draft.dayOffWeekdays.includes(dayIdx)) {
            draft.dayOffWeekdays = draft.dayOffWeekdays.filter(x => x !== dayIdx);
          } else {
            draft.dayOffWeekdays.push(dayIdx);
          }
          check.classList.toggle('selected');
        });
        weekdayChecks.appendChild(check);
      }
      dowRow.appendChild(weekdayChecks);
      detail.appendChild(dowRow);

      // --- 日付で指定 ---
      const dateSep = el('div');
      dateSep.style.marginTop = '12px';
      dateSep.style.borderTop = '1px solid var(--c-border)';
      dateSep.style.paddingTop = '10px';
      dateSep.appendChild(textEl('p', '', '特定の日付'));
      detail.appendChild(dateSep);

      const addRow = el('div', 'form-row');
      const dateInput = createInput('date', '', 'form-input');
      addRow.appendChild(dateInput);
      addRow.appendChild(createButton('追加', 'btn-sm btn-primary', () => {
        if (!dateInput.value) return;
        if (!draft.unavailableDates) draft.unavailableDates = [];
        if (!draft.unavailableDates.includes(dateInput.value)) {
          draft.unavailableDates.push(dateInput.value);
          draft.unavailableDates.sort();
          clearElement(container);
          renderStaffForm(container, draft);
        }
      }));
      detail.appendChild(addRow);

      for (const date of (draft.unavailableDates || [])) {
        const entry = el('div', 'unavail-date-entry');
        entry.appendChild(textEl('span', '', date));
        entry.appendChild(createButton('削除', 'btn-sm btn-danger', () => {
          draft.unavailableDates = draft.unavailableDates.filter(d => d !== date);
          clearElement(container);
          renderStaffForm(container, draft);
        }));
        detail.appendChild(entry);
      }

      option.appendChild(detail);
    }

    cb.addEventListener('change', () => {
      if (!cb.checked) {
        draft.dayOffWeekdays = [];
        draft.unavailableDates = [];
        delete draft._showUnavailDays;
      } else {
        draft._showUnavailDays = true;
      }
      clearElement(container);
      renderStaffForm(container, draft);
    });

    container.appendChild(option);
  }

  function renderTrainingOption(container, draft) {
    const option = el('div', 'status-option');
    const header = el('label', 'status-option-header');
    const cb = createInput('checkbox', null, '');
    cb.checked = !!draft.trainingPairId || draft._showTraining;
    header.appendChild(cb);
    header.appendChild(textEl('span', '', '研修中（ペア）― 別の職員とセットで割り当て'));
    option.appendChild(header);

    if (cb.checked) {
      const detail = el('div', 'status-option-detail');
      const row = el('div', 'form-row');
      row.appendChild(textEl('span', '', 'ペア相手'));

      const otherStaff = state.staff.filter(s => s.id !== draft.id);
      const options = [{ value: '', label: '-- 選択 --' }, ...otherStaff.map(s => ({ value: s.id, label: s.name }))];
      const pairSelect = createSelect(options, draft.trainingPairId || '');
      pairSelect.addEventListener('change', () => {
        draft.trainingPairId = pairSelect.value || null;
      });
      row.appendChild(pairSelect);
      detail.appendChild(row);

      // ペア枠消費モード選択
      const modeRow = el('div', 'form-row');
      modeRow.appendChild(textEl('span', 'form-label', '枠の数え方'));
      const modeOptions = [
        { value: 'double', label: '2人で2枠（既定）' },
        { value: 'single', label: '2人で1枠' },
      ];
      const modeSelect = createSelect(modeOptions, draft.pairSlotMode || 'double');
      modeSelect.addEventListener('change', () => {
        draft.pairSlotMode = modeSelect.value;
      });
      modeRow.appendChild(modeSelect);
      const modeHint = textEl('p', '', '「2人で1枠」は研修生と指導者で1人分として数えます');
      modeHint.style.fontSize = '11px';
      modeHint.style.color = '#6B7280';
      modeHint.style.marginTop = '4px';
      detail.appendChild(modeRow);
      detail.appendChild(modeHint);
      option.appendChild(detail);
    }

    cb.addEventListener('change', () => {
      if (!cb.checked) {
        draft.trainingPairId = null;
        delete draft.pairSlotMode;
        delete draft._showTraining;
      } else {
        draft._showTraining = true;
      }
      clearElement(container);
      renderStaffForm(container, draft);
    });

    container.appendChild(option);
  }

  function renderExemptOption(container, draft) {
    const option = el('div', 'status-option');
    const header = el('label', 'status-option-header');
    const cb = createInput('checkbox', null, '');
    cb.checked = !!draft.exemptFromDate || draft._showExempt;
    header.appendChild(cb);
    header.appendChild(textEl('span', '', '対象外（免除）― 指定日以降を当番対象外に'));
    option.appendChild(header);

    if (cb.checked) {
      const detail = el('div', 'status-option-detail');
      const row = el('div', 'form-row');
      row.appendChild(textEl('span', '', '開始日'));
      const dateInput = createInput('date', draft.exemptFromDate || '', 'form-input');
      dateInput.addEventListener('change', () => {
        draft.exemptFromDate = dateInput.value || null;
      });
      row.appendChild(dateInput);
      detail.appendChild(row);
      option.appendChild(detail);
    }

    cb.addEventListener('change', () => {
      if (!cb.checked) {
        draft.exemptFromDate = null;
        delete draft._showExempt;
      } else {
        draft._showExempt = true;
      }
      clearElement(container);
      renderStaffForm(container, draft);
    });

    container.appendChild(option);
  }

  // ==========================================================
  // 当番表グリッド
  // ==========================================================
  function renderGrid() {
    const toolbar = document.getElementById('grid-toolbar');
    clearElement(toolbar);

    const title = textEl('h2', '', `${state.calendar.year}年${state.calendar.month}月の当番表`);
    toolbar.appendChild(title);

    const btnGroup = el('div', 'form-row');
    btnGroup.appendChild(createButton('自動割り当て', 'btn-success btn-lg', () => {
      runAutoAssign();
    }));
    btnGroup.appendChild(createButton('割り当てをクリア', 'btn-outline btn-sm', () => {
      // 表示中の月の割り当てだけを対象にする（他月のデータは残す）
      const monthPrefix = `${state.calendar.year}-${String(state.calendar.month).padStart(2, '0')}`;
      const monthKeys = Object.keys(state.assignments).filter(k => k.startsWith(monthPrefix));
      const count = monthKeys.reduce((sum, k) => sum + Object.values(state.assignments[k]).flat().length, 0);
      if (count === 0) {
        showToast('クリアする割り当てはありません');
        return;
      }
      if (!confirm(`${state.calendar.month}月の割り当て${count}件を消します。よろしいですか？\n（直後なら「元に戻す」ボタンで復元できます）`)) return;
      pushUndo();
      for (const k of monthKeys) delete state.assignments[k];
      saveData();
      renderGrid();
      showToast('割り当てをクリアしました（「元に戻す」で復元できます）');
    }));
    btnGroup.appendChild(createButton('当番回数を確認', 'btn-outline btn-sm', () => {
      const counts = countCurrentAssignments();
      showAssignmentStats(counts);
    }));
    toolbar.appendChild(btnGroup);

    const container = document.getElementById('grid-container');
    clearElement(container);

    if (state.slots.length === 0) {
      container.appendChild(textEl('p', '', '当番枠を設定してください。'));
      return;
    }

    const table = el('table', 'grid-table');

    // ヘッダー行
    const thead = el('thead');
    const headRow = el('tr');
    headRow.appendChild(textEl('th', '', '日'));
    headRow.appendChild(textEl('th', '', '曜'));

    for (const slot of state.slots) {
      const th = el('th');
      const slotLabel = `${slot.name}`;
      const timeLabel = `${slot.startTime}〜${slot.endTime}`;
      th.appendChild(textEl('div', '', slotLabel));
      const timeSub = textEl('div', '', timeLabel);
      timeSub.style.fontSize = '10px';
      timeSub.style.fontWeight = '400';
      timeSub.style.opacity = '0.8';
      th.appendChild(timeSub);

      if (slot.requiredCount > 1) {
        const countSub = textEl('div', '', `${slot.requiredCount}人`);
        countSub.style.fontSize = '10px';
        countSub.style.fontWeight = '400';
        th.appendChild(countSub);
      }
      headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    // データ行
    const tbody = el('tbody');
    const daysInMonth = getDaysInMonth(state.calendar.year, state.calendar.month);
    const monthKey = `${state.calendar.year}-${String(state.calendar.month).padStart(2, '0')}`;

    for (let day = 1; day <= daysInMonth; day++) {
      const dow = getDayOfWeek(state.calendar.year, state.calendar.month, day);
      const dayOff = isDayOff(day);
      const hasActive = hasAnyActiveSlot(day);
      const dateKey = formatDate(state.calendar.year, state.calendar.month, day);
      const isHoliday = state.calendar.holidays.includes(day);

      const row = el('tr');
      if (dayOff && !hasActive) {
        // 全枠が対象外の休日のみ行スタイルを適用
        if (isHoliday) {
          row.className = 'holiday';
        } else {
          row.className = 'weekend';
        }
      }

      // 日付列
      const dayCell = textEl('td', 'day-col', String(day));
      row.appendChild(dayCell);

      // 曜日列（ダブルクリックで時間帯切替）
      const timeSetting = getDayTimeSetting(day);
      const dowLabel = WEEKDAY_NAMES[dow] + (timeSetting === 'am' ? ' 午前' : timeSetting === 'pm' ? ' 午後' : '');
      const dowCell = textEl('td', 'weekday-col', dowLabel);
      if (dow === 0) dowCell.style.color = '#DC2626';
      if (dow === 6) dowCell.style.color = '#2563EB';
      if (timeSetting !== 'full') {
        dowCell.style.backgroundColor = '#FEF3C7';
        dowCell.style.fontSize = '11px';
      }
      if (!dayOff || hasActive) {
        dowCell.title = 'ダブルクリックで時間帯切替（全日→午前→午後→全日）';
        dowCell.style.cursor = 'pointer';
        const currentDay = day;
        dowCell.addEventListener('dblclick', () => {
          if (!state.calendar.dayTimeSettings) state.calendar.dayTimeSettings = {};
          const current = state.calendar.dayTimeSettings[currentDay] || 'full';
          const next = current === 'full' ? 'am' : current === 'am' ? 'pm' : 'full';
          if (next === 'full') {
            delete state.calendar.dayTimeSettings[currentDay];
          } else {
            state.calendar.dayTimeSettings[currentDay] = next;
          }
          saveData();
          renderGrid();
        });
      }
      row.appendChild(dowCell);

      // 各枠のセル（セル単位で有効判定）
      for (const slot of state.slots) {
        const td = el('td', 'slot-cell');

        if (!isSlotActiveForDay(slot, day)) {
          // この枠はこの日に対象外
          td.className = 'weekend-label';
          td.textContent = (dayOff && !hasActive) ? (isHoliday ? '祝日' : '休') : '-';
        } else {
          // 割り当て済みの職員を表示
          const assignments = getAssignmentsForCell(dateKey, slot.id);
          if (assignments.length > 0) {
            for (const staffId of assignments) {
              const staffObj = state.staff.find(s => s.id === staffId);
              if (staffObj) {
                const nameSpan = textEl('div', '', staffObj.name);
                nameSpan.style.fontSize = '12px';
                // タグ色の小さなドット
                for (const tid of (staffObj.tags || [])) {
                  const tag = state.tags.find(t => t.id === tid);
                  if (tag) {
                    const dot = el('span');
                    dot.style.display = 'inline-block';
                    dot.style.width = '8px';
                    dot.style.height = '8px';
                    dot.style.borderRadius = '50%';
                    dot.style.backgroundColor = tag.color;
                    dot.style.marginLeft = '3px';
                    dot.style.verticalAlign = 'middle';
                    nameSpan.appendChild(dot);
                  }
                }
                td.appendChild(nameSpan);
              }
            }
          }

          // セルクリックで手動編集（Phase 2で本格実装、ここでは簡易版）
          const currentDay = day;
          const currentSlotId = slot.id;
          td.addEventListener('click', () => {
            openCellEditModal(dateKey, currentSlotId, currentDay);
          });
        }

        row.appendChild(td);
      }

      tbody.appendChild(row);
    }
    table.appendChild(tbody);
    container.appendChild(table);
  }

  function getAssignmentsForCell(dateKey, slotId) {
    if (!state.assignments[dateKey]) return [];
    return state.assignments[dateKey][slotId] || [];
  }

  /** 職員の制約違反を検出して警告メッセージ配列を返す */
  function getStaffWarnings(staff, dateKey, day, dow, slot) {
    const warnings = [];
    if (isStaffUnavailable(staff, dateKey, day, dow)) {
      if (staff.exemptFromDate && dateKey >= staff.exemptFromDate) warnings.push('対象外');
      else if (staff.dayOffWeekdays && staff.dayOffWeekdays.includes(dow)) warnings.push('不可（公休曜日）');
      else if (staff.unavailableDates && staff.unavailableDates.includes(dateKey)) warnings.push('不可日');
    }
    if (staff.shortTime && !isTimeOverlap(staff.shortTime.start, staff.shortTime.end, slot.startTime, slot.endTime)) {
      warnings.push(`時短(${staff.shortTime.start}-${staff.shortTime.end})`);
    }
    return warnings;
  }

  // ==========================================================
  // セル編集モーダル（手動割り当て）
  // ==========================================================
  function openCellEditModal(dateKey, slotId, day) {
    const slot = state.slots.find(s => s.id === slotId);
    if (!slot) return;

    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('hidden');
    clearElement(overlay);

    const modal = el('div', 'modal');

    // ヘッダー
    const header = el('div', 'modal-header');
    const dow = getDayOfWeek(state.calendar.year, state.calendar.month, day);
    header.appendChild(textEl('h3', '', `${state.calendar.month}/${day}（${WEEKDAY_NAMES[dow]}）${slot.name}`));
    const closeBtn = textEl('button', 'modal-close', '\u00d7');
    closeBtn.addEventListener('click', closeModal);
    header.appendChild(closeBtn);
    modal.appendChild(header);

    // ボディ
    const body = el('div', 'modal-body');
    const currentAssigned = getAssignmentsForCell(dateKey, slotId);

    body.appendChild(textEl('p', '', `必要人数: ${slot.requiredCount}人　現在: ${currentAssigned.length}人`));

    // 職員リスト（チェックボックスで選択 + 制約違反警告）
    body.appendChild(textEl('h4', '', '職員を選択'));
    const staffList = el('div');

    // この日に他枠で既に割り当てられた職員を取得
    const assignedOtherSlots = new Set();
    if (state.assignments[dateKey]) {
      for (const [sid, arr] of Object.entries(state.assignments[dateKey])) {
        if (sid !== slotId) {
          for (const id of arr) assignedOtherSlots.add(id);
        }
      }
    }

    // タグフィルター情報
    const allowedTagSet = (slot.allowedTags && slot.allowedTags.length > 0) ? new Set(slot.allowedTags) : null;

    for (const s of state.staff) {
      const row = el('div', 'form-row');

      // 制約違反チェック
      const warnings = getStaffWarnings(s, dateKey, day, dow, slot);
      const isDuplicate = assignedOtherSlots.has(s.id);
      const isTagExcluded = allowedTagSet && !(s.tags || []).some(t => allowedTagSet.has(t));
      if (isTagExcluded) warnings.push('対象外タグ');

      const cb = createInput('checkbox', null, '');
      cb.checked = currentAssigned.includes(s.id);
      const staffId = s.id;
      cb.addEventListener('change', () => {
        pushUndo();
        if (!state.assignments[dateKey]) state.assignments[dateKey] = {};
        if (!state.assignments[dateKey][slotId]) state.assignments[dateKey][slotId] = [];
        const arr = state.assignments[dateKey][slotId];
        if (cb.checked) {
          if (!arr.includes(staffId)) arr.push(staffId);
        } else {
          state.assignments[dateKey][slotId] = arr.filter(id => id !== staffId);
        }
        saveData();
      });
      const label = el('label', 'form-row');
      label.style.cursor = 'pointer';
      label.style.gap = '6px';
      label.appendChild(cb);

      const nameSpan = textEl('span', '', s.name);
      if (warnings.length > 0 || isDuplicate) {
        nameSpan.style.color = '#DC2626';
      }
      label.appendChild(nameSpan);

      // タグバッジ
      for (const tid of (s.tags || [])) {
        const tag = state.tags.find(t => t.id === tid);
        if (tag) {
          const badge = textEl('span', 'tag-badge', tag.name);
          badge.style.backgroundColor = tag.color;
          badge.style.fontSize = '10px';
          label.appendChild(badge);
        }
      }

      // 警告表示
      if (isDuplicate) {
        const warn = textEl('span', 'status-badge unavailable', '同日重複');
        warn.style.marginLeft = '4px';
        label.appendChild(warn);
      }
      for (const w of warnings) {
        const warn = textEl('span', 'status-badge unavailable', w);
        warn.style.marginLeft = '4px';
        label.appendChild(warn);
      }

      row.appendChild(label);
      staffList.appendChild(row);
    }
    body.appendChild(staffList);
    modal.appendChild(body);

    // フッター
    const footer = el('div', 'modal-footer');
    footer.appendChild(createButton('閉じる', 'btn-primary', () => {
      closeModal();
      renderGrid();
    }));
    modal.appendChild(footer);

    overlay.appendChild(modal);
  }

  // ==========================================================
  // 自動割り当て（Phase 2用スタブ）
  // ==========================================================
  function runAutoAssign() {
    if (state.staff.length === 0) {
      showToast('職員が登録されていません');
      return;
    }
    if (state.slots.length === 0) {
      showToast('当番枠が設定されていません');
      return;
    }

    pushUndo();

    const { year, month } = state.calendar;
    const daysInMonth = getDaysInMonth(year, month);
    const assignments = {};

    // 職員リストを最初にシャッフル（登録順バイアスを排除）
    const shuffledStaff = [...state.staff];
    for (let i = shuffledStaff.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledStaff[i], shuffledStaff[j]] = [shuffledStaff[j], shuffledStaff[i]];
    }

    // 各職員の割り当て回数カウンター（全体 + 枠別 + 曜日別）
    const assignCount = {};
    const slotAssignCount = {}; // { slotId: { staffId: count } }
    const dowAssignCount = {}; // { staffId: { dow: count } } — 曜日パターン固定化防止
    for (const s of state.staff) {
      assignCount[s.id] = 0;
      dowAssignCount[s.id] = {};
      for (let d = 0; d < 7; d++) dowAssignCount[s.id][d] = 0;
    }
    for (const slot of state.slots) {
      slotAssignCount[slot.id] = {};
      for (const s of state.staff) slotAssignCount[slot.id][s.id] = 0;
    }

    // 可用率の事前計算: 各職員が月内で「割り当て可能な日数」を数え、
    // 全職員の平均と比較した比率を算出する。
    // 同日重複禁止のため、1日に入れるのは最大1回。重要なのは「何日出られるか」であり
    // 「何スロットに入れるか」ではない（スロット数が多くても回数は増えない）。
    // 公休・不可日・免除で出勤可能日が少ない職員は可用率 < 1 となり、
    // ソート時に回数を可用率で割ることで「入れるときに優先ピック」される → 総回数の公平化
    const availableDays = {};
    for (const s of state.staff) {
      if (s.dutyWeight === 0) continue;
      let count = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        if (!hasAnyActiveSlot(d)) continue;
        const dk = formatDate(year, month, d);
        const dw = getDayOfWeek(year, month, d);
        if (isStaffUnavailable(s, dk, d, dw)) continue;
        // この日にこの職員が入れる枠が1つでもあるか
        let hasEligibleSlot = false;
        for (const slot of state.slots) {
          if (!isSlotActiveForDay(slot, d)) continue;
          if (s.shortTime && !isTimeOverlap(s.shortTime.start, s.shortTime.end, slot.startTime, slot.endTime)) continue;
          hasEligibleSlot = true;
          break;
        }
        if (hasEligibleSlot) count++;
      }
      availableDays[s.id] = count;
    }
    // 平均出勤可能日数（dutyWeight > 0 の職員のみ）
    const activeStaff = state.staff.filter(s => s.dutyWeight !== 0);
    const avgAvailable = activeStaff.length > 0
      ? activeStaff.reduce((sum, s) => sum + (availableDays[s.id] || 0), 0) / activeStaff.length
      : 1;
    // 可用率: その職員の出勤可能日数 / 平均出勤可能日数
    const availabilityRatio = {};
    for (const s of activeStaff) {
      const raw = (availableDays[s.id] || 0) / (avgAvailable || 1);
      availabilityRatio[s.id] = Math.max(raw, 0.1); // 0除算防止
    }

    // ペアsingleモードで実効枠数を正確にカウントするヘルパー
    // ペア(single)は2人で1枠消費、それ以外は1人1枠消費
    const countFilledSlots = (arr) => {
      let count = 0;
      const counted = new Set();
      for (const id of arr) {
        if (counted.has(id)) continue;
        counted.add(id);
        const obj = state.staff.find(s => s.id === id);
        // singleモードのペアは相手とセットで1枠
        if (obj && obj.trainingPairId && (obj.pairSlotMode === 'single') && arr.includes(obj.trainingPairId) && !counted.has(obj.trainingPairId)) {
          counted.add(obj.trainingPairId);
        }
        count++;
      }
      return count;
    };

    let workDayIndex = 0; // 枠処理順ローテーション用
    for (let day = 1; day <= daysInMonth; day++) {
      // 日単位スキップ廃止: この日にアクティブな枠があるかで判定
      if (!hasAnyActiveSlot(day)) continue;

      const dateKey = formatDate(year, month, day);
      const dow = getDayOfWeek(year, month, day);
      assignments[dateKey] = {};

      // この日に割り当て済みの職員（同日重複禁止用）
      const assignedToday = new Set();

      // 枠の処理順を日ごとにローテーション（先頭の枠が常に有利になるのを防ぐ）
      const rotation = workDayIndex % state.slots.length;
      const rotatedSlots = [...state.slots.slice(rotation), ...state.slots.slice(0, rotation)];
      // 全枠の空配列を先に初期化（ローテーション順に関係なく）
      for (const s of state.slots) assignments[dateKey][s.id] = [];
      workDayIndex++;

      // この日に各職員が入れるアクティブ枠数を事前計算
      // （時短で午前しか入れない人 = 1、通常で午前午後どちらも入れる人 = 2）
      const eligibleSlotCountToday = {};
      for (const s of state.staff) {
        let cnt = 0;
        for (const sl of state.slots) {
          if (!isSlotActiveForDay(sl, day)) continue;
          if (s.shortTime && !isTimeOverlap(s.shortTime.start, s.shortTime.end, sl.startTime, sl.endTime)) continue;
          cnt++;
        }
        eligibleSlotCountToday[s.id] = cnt;
      }

      // 1人（またはペア）を指定枠に割り当てるヘルパー
      const assignOne = (staffId, slot) => {
        const arr = assignments[dateKey][slot.id];
        const needed = slot.requiredCount;
        const staffObj = state.staff.find(s => s.id === staffId);
        const hasPair = staffObj && staffObj.trainingPairId;
        const isSingle = hasPair && (staffObj.pairSlotMode === 'single');

        // 枠に空きがあるかチェック（ペアdoubleなら2枠必要）
        const filled = countFilledSlots(arr);
        const slotsNeeded = (hasPair && !isSingle) ? 2 : 1;
        if (filled + slotsNeeded > needed) return false;

        // 本人を割り当て
        arr.push(staffId);
        assignedToday.add(staffId);
        assignCount[staffId] = (assignCount[staffId] || 0) + 1;
        slotAssignCount[slot.id][staffId] = (slotAssignCount[slot.id][staffId] || 0) + 1;
        if (dowAssignCount[staffId]) dowAssignCount[staffId][dow] = (dowAssignCount[staffId][dow] || 0) + 1;

        // ペア相手も同じ枠に入れる
        if (hasPair) {
          const pairId = staffObj.trainingPairId;
          if (!arr.includes(pairId) && !assignedToday.has(pairId)) {
            arr.push(pairId);
            assignedToday.add(pairId);
            assignCount[pairId] = (assignCount[pairId] || 0) + 1;
            slotAssignCount[slot.id][pairId] = (slotAssignCount[slot.id][pairId] || 0) + 1;
            if (dowAssignCount[pairId]) dowAssignCount[pairId][dow] = (dowAssignCount[pairId][dow] || 0) + 1;
          }
        }
        return true;
      };

      // Step 1: 全枠の曜日固定を先に確定する。
      // ローテーション順で固定枠より後に処理される枠の固定職員が、
      // 先行枠の通常候補として取られるのを防ぐ（ハード制約はStep 2に優先）
      for (const slot of state.slots) {
        if (!isSlotActiveForDay(slot, day)) continue;
        const fixedStaff = [];
        for (const s of shuffledStaff) {
          if (!s.fixedDays) continue;
          for (const fd of s.fixedDays) {
            if (fd.slotId === slot.id && fd.weekdays.includes(dow)) {
              if (!isStaffUnavailable(s, dateKey, day, dow)) {
                fixedStaff.push(s.id);
              }
            }
          }
        }
        for (const staffId of fixedStaff) {
          if (countFilledSlots(assignments[dateKey][slot.id]) >= slot.requiredCount) break;
          if (assignedToday.has(staffId)) continue;
          assignOne(staffId, slot);
        }
      }

      // Step 2: 残りの枠をローテーション順に埋める
      for (const slot of rotatedSlots) {

        // 日の時間帯設定でこのスロットが対象外なら飛ばす
        if (!isSlotActiveForDay(slot, day)) continue;

        const needed = slot.requiredCount;
        if (countFilledSlots(assignments[dateKey][slot.id]) >= needed) continue;

        // 割り当て候補を取得（シャッフル済みリストベースで登録順バイアスなし）
        const candidates = getEligibleStaff(slot, dateKey, day, dow, assignedToday, assignments, shuffledStaff);

        // 重み付き回数が少ない順に安定ソート
        const sc = slotAssignCount[slot.id] || {};
        const weightedCount = (id) => {
          const s = state.staff.find(st => st.id === id);
          const w = (s && s.dutyWeight) ? s.dutyWeight : 1;
          const ar = availabilityRatio[id] || 1;
          return (assignCount[id] || 0) / w / ar;
        };
        // 枠選択肢ペナルティ: 今日複数枠に入れる人は「後のラウンドでも拾える」ので
        // わずかにスコアを上げる（= 優先度を下げる）。
        // これにより、この枠しか入れない人（時短等）が同程度の回数なら優先される。
        // 同日重複禁止により通常職員は1日1回しか入れないが、
        // 複数ラウンド参加できる分だけ拾われやすい非対称性を補正する。
        const slotPenalty = (id) => Math.max(0, (eligibleSlotCountToday[id] || 1) - 1) * 0.5;

        candidates.sort((a, b) => {
          const totalDiff = (weightedCount(a) + slotPenalty(a)) - (weightedCount(b) + slotPenalty(b));
          if (Math.abs(totalDiff) > 0.001) return totalDiff;
          const slotDiff = (sc[a] || 0) - (sc[b] || 0);
          if (slotDiff !== 0) return slotDiff;
          // 同曜日への偏りを防ぐ（月水金パターン固定化の回避）
          return (dowAssignCount[a]?.[dow] || 0) - (dowAssignCount[b]?.[dow] || 0);
        });

        // 連続回避: 前日に割り当てられた職員を後回しに
        const prevDateKey = formatDate(year, month, day - 1);
        const prevAssigned = new Set();
        if (day > 1 && assignments[prevDateKey]) {
          for (const sId of Object.values(assignments[prevDateKey]).flat()) {
            prevAssigned.add(sId);
          }
        }

        // 連続でない候補を優先
        const nonConsecutive = candidates.filter(id => !prevAssigned.has(id));
        const consecutive = candidates.filter(id => prevAssigned.has(id));
        const sorted = [...nonConsecutive, ...consecutive];

        for (const staffId of sorted) {
          if (countFilledSlots(assignments[dateKey][slot.id]) >= needed) break;
          if (assignedToday.has(staffId)) continue;

          // ペアの相手が既に別枠に入っている場合はスキップ（ペア分離防止）
          const staffObj = state.staff.find(s => s.id === staffId);
          if (staffObj && staffObj.trainingPairId && assignedToday.has(staffObj.trainingPairId)) {
            continue;
          }

          assignOne(staffId, slot);
        }
      }
    }

    // === 2パス目: 連続回避のスワップ ===
    const workDays = [];
    for (let day = 1; day <= daysInMonth; day++) {
      if (hasAnyActiveSlot(day)) workDays.push(day);
    }
    for (let wi = 0; wi < workDays.length - 1; wi++) {
      const dayA = workDays[wi];
      const dayB = workDays[wi + 1];
      const keyA = formatDate(year, month, dayA);
      const keyB = formatDate(year, month, dayB);
      if (!assignments[keyA] || !assignments[keyB]) continue;

      const dowB = getDayOfWeek(year, month, dayB);
      for (const slot of state.slots) {
        const arrA = assignments[keyA][slot.id] || [];
        const arrB = assignments[keyB][slot.id] || [];
        // 連続している職員を検出
        for (const staffId of [...arrA]) {
          if (!arrB.includes(staffId)) continue;

          // ペアメンバーはスワップしない
          const sObj = state.staff.find(s => s.id === staffId);
          if (sObj && sObj.trainingPairId) continue;

          // 曜日固定でこの枠に入っている職員は退去させない（ハード制約は連続回避より優先）
          if (sObj && (sObj.fixedDays || []).some(fd => fd.slotId === slot.id && fd.weekdays.includes(dowB))) continue;

          // dayBのその日の全割り当て済み職員を取得（重複防止）
          const dayBAllAssigned = new Set(Object.values(assignments[keyB]).flat());

          const keyPrev = wi > 0 ? formatDate(year, month, workDays[wi - 1]) : null;
          const prevAll = keyPrev && assignments[keyPrev] ? new Set(Object.values(assignments[keyPrev]).flat()) : new Set();

          // スワップ候補: dayBの他枠に未割り当て + dayAにもいない + 前日にもいない
          // ペア職員は1人分の置換に相手を同伴できず分離してしまうため候補から外す
          const swapCandidates = getEligibleStaff(slot, keyB, dayB, dowB, dayBAllAssigned, assignments, shuffledStaff)
            .filter(cid => {
              if (arrA.includes(cid) || prevAll.has(cid)) return false;
              const cObj = state.staff.find(s => s.id === cid);
              return !(cObj && cObj.trainingPairId);
            });

          if (swapCandidates.length > 0) {
            // 回数バランスを考慮: 重み付き回数が最も少ない候補を選ぶ
            const swapWeighted = (id) => {
              const sObj2 = state.staff.find(st => st.id === id);
              const w2 = (sObj2 && sObj2.dutyWeight) ? sObj2.dutyWeight : 1;
              const ar2 = availabilityRatio[id] || 1;
              return (assignCount[id] || 0) / w2 / ar2;
            };
            swapCandidates.sort((a, b) => swapWeighted(a) - swapWeighted(b));
            const swapWith = swapCandidates[0];
            const idx = arrB.indexOf(staffId);
            if (idx >= 0) {
              arrB[idx] = swapWith;
              assignCount[staffId]--;
              assignCount[swapWith] = (assignCount[swapWith] || 0) + 1;
              if (slotAssignCount[slot.id]) {
                slotAssignCount[slot.id][staffId] = (slotAssignCount[slot.id][staffId] || 1) - 1;
                slotAssignCount[slot.id][swapWith] = (slotAssignCount[slot.id][swapWith] || 0) + 1;
              }
            }
          }
        }
      }
    }

    state.assignments = assignments;
    saveData();
    renderGrid();
    showAssignmentStats(assignCount);
  }

  /** 現在のグリッド状態から各職員の当番回数を集計 */
  function countCurrentAssignments() {
    const counts = {};
    for (const s of state.staff) {
      counts[s.id] = 0;
    }
    for (const dateKey of Object.keys(state.assignments)) {
      const daySlots = state.assignments[dateKey];
      for (const slotId of Object.keys(daySlots)) {
        const staffIds = daySlots[slotId] || [];
        for (const id of staffIds) {
          counts[id] = (counts[id] || 0) + 1;
        }
      }
    }
    return counts;
  }

  /** 職員の回数に影響する条件を取得 */
  function getStaffCountFactors(staff) {
    const factors = [];
    // 当番頻度
    const w = staff.dutyWeight ?? 1;
    if (w === 0) factors.push('当番なし');
    else if (w >= 2) factors.push('できるだけ入れる');
    else if (w > 1) factors.push('多め');
    else if (w < 1) factors.push('少なめ');
    // 時短
    if (staff.shortTime) {
      factors.push(`時短(${staff.shortTime.start}-${staff.shortTime.end})`);
    }
    // 公休曜日
    if (staff.dayOffWeekdays && staff.dayOffWeekdays.length > 0) {
      factors.push(`公休: 毎週${staff.dayOffWeekdays.map(d => WEEKDAY_NAMES[d]).join('')}`);
    }
    // 不可日
    if (staff.unavailableDates && staff.unavailableDates.length > 0) {
      factors.push(`不可日: ${staff.unavailableDates.length}日`);
    }
    // 曜日固定
    if (staff.fixedDays && staff.fixedDays.length > 0) {
      for (const fd of staff.fixedDays) {
        const slotObj = state.slots.find(s => s.id === fd.slotId);
        const slotName = slotObj ? slotObj.name : '?';
        const days = fd.weekdays.map(d => WEEKDAY_NAMES[d]).join('');
        factors.push(`固定: ${slotName}・${days}`);
      }
    }
    // ペア
    if (staff.trainingPairId) {
      const pair = state.staff.find(s => s.id === staff.trainingPairId);
      const pairName = pair ? pair.name : '?';
      const modeLabel = (staff.pairSlotMode === 'single') ? '1枠' : '2枠';
      factors.push(`研修ペア: ${pairName}(${modeLabel})`);
    }
    // 対象外
    if (staff.exemptFromDate) {
      factors.push(`対象外: ${staff.exemptFromDate}〜`);
    }
    return factors;
  }

  /** 割り当て結果の統計表示 */
  function showAssignmentStats(assignCount) {
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('hidden');
    clearElement(overlay);

    const modal = el('div', 'modal');

    const header = el('div', 'modal-header');
    header.appendChild(textEl('h3', '', '割り当て結果'));
    const closeBtn = textEl('button', 'modal-close', '\u00d7');
    closeBtn.addEventListener('click', closeModal);
    header.appendChild(closeBtn);
    modal.appendChild(header);

    const body = el('div', 'modal-body');

    // 集計
    const counts = state.staff.map(s => ({
      id: s.id, name: s.name, count: assignCount[s.id] || 0,
      tags: s.tags || [], factors: getStaffCountFactors(s)
    }));
    const total = counts.reduce((sum, c) => sum + c.count, 0);
    const avg = counts.length > 0 ? (total / counts.length).toFixed(1) : 0;
    counts.sort((a, b) => b.count - a.count);

    body.appendChild(textEl('p', '', `合計: ${total}件　平均: ${avg}回/人`));

    const table = el('table', 'grid-table');
    table.style.minWidth = 'auto';
    const thead = el('thead');
    const headRow = el('tr');
    headRow.appendChild(textEl('th', '', '職員名'));
    headRow.appendChild(textEl('th', '', '回数'));
    headRow.appendChild(textEl('th', '', '偏差'));
    headRow.appendChild(textEl('th', '', '回数に影響する条件'));
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = el('tbody');
    for (const c of counts) {
      const row = el('tr');
      const nameCell = el('td');
      nameCell.appendChild(textEl('span', '', c.name));
      for (const tid of c.tags) {
        const tag = state.tags.find(t => t.id === tid);
        if (tag) {
          const badge = textEl('span', 'tag-badge', tag.name);
          badge.style.backgroundColor = tag.color;
          badge.style.fontSize = '10px';
          badge.style.marginLeft = '4px';
          nameCell.appendChild(badge);
        }
      }
      row.appendChild(nameCell);
      row.appendChild(textEl('td', '', String(c.count)));
      const diff = (c.count - parseFloat(avg)).toFixed(1);
      const diffCell = textEl('td', '', (diff >= 0 ? '+' : '') + diff);
      if (Math.abs(parseFloat(diff)) > 2) diffCell.style.color = '#DC2626';
      row.appendChild(diffCell);
      // 条件列
      const factorCell = el('td');
      factorCell.style.fontSize = '12px';
      if (c.factors.length > 0) {
        factorCell.style.color = '#6B7280';
        factorCell.appendChild(document.createTextNode(c.factors.join('、')));
      } else {
        factorCell.style.color = '#9CA3AF';
        factorCell.appendChild(document.createTextNode('なし（通常）'));
      }
      row.appendChild(factorCell);
      tbody.appendChild(row);
    }
    table.appendChild(tbody);
    body.appendChild(table);
    modal.appendChild(body);

    const footer = el('div', 'modal-footer');
    footer.appendChild(createButton('閉じる', 'btn-primary', closeModal));
    modal.appendChild(footer);

    overlay.appendChild(modal);
  }

  /** 職員がその日・その枠に割り当て可能かチェック */
  function getEligibleStaff(slot, dateKey, day, dow, assignedToday, assignments, staffList) {
    const eligible = [];
    const list = staffList || state.staff;

    // タグフィルター: この枠に許可されたタグが設定されている場合、該当タグを持つ職員のみ対象
    const allowed = slot.allowedTags && slot.allowedTags.length > 0 ? new Set(slot.allowedTags) : null;

    for (const s of list) {
      // 当番頻度0（出さない）の職員はスキップ
      if (s.dutyWeight === 0) continue;

      // タグフィルター
      if (allowed) {
        const staffTags = s.tags || [];
        if (!staffTags.some(t => allowed.has(t))) continue;
      }

      // 既にこの日に割り当て済み
      if (assignedToday.has(s.id)) continue;

      // 利用不可チェック
      if (isStaffUnavailable(s, dateKey, day, dow)) continue;

      // 時短チェック: 勤務時間帯が枠と重なるか
      if (s.shortTime) {
        if (!isTimeOverlap(s.shortTime.start, s.shortTime.end, slot.startTime, slot.endTime)) {
          continue;
        }
      }

      // 曜日固定の職員は、固定枠に既に割り当て済みなら他枠にはは入れない（同日重複禁止で処理）
      // ただし固定枠が満員で入れなかった場合は他枠の候補になる
      if (s.fixedDays && s.fixedDays.length > 0) {
        const fixedForThisDay = s.fixedDays.filter(fd => fd.weekdays.includes(dow));
        if (fixedForThisDay.length > 0) {
          // この職員が固定枠に既に入っているか確認
          const alreadyFixed = fixedForThisDay.some(fd => {
            const slotAssign = assignments[dateKey] && assignments[dateKey][fd.slotId];
            return slotAssign && slotAssign.includes(s.id);
          });
          if (alreadyFixed) continue; // 固定枠に入っている→他枠には入れない
          // 固定枠に入れなかった→他枠の候補になる（超過分の救済）
        }
      }

      // ペア相手がこの枠に入れるかチェック（ペア分離防止）
      if (s.trainingPairId) {
        const pair = state.staff.find(p => p.id === s.trainingPairId);
        if (pair) {
          // ペア相手が利用不可 or 時短で枠に合わない場合、本人もスキップ
          if (isStaffUnavailable(pair, dateKey, day, dow)) continue;
          if (pair.shortTime && !isTimeOverlap(pair.shortTime.start, pair.shortTime.end, slot.startTime, slot.endTime)) continue;
        }
      }

      eligible.push(s.id);
    }

    return eligible;
  }

  /** 職員がその日に割り当て不可かどうか */
  function isStaffUnavailable(staff, dateKey, day, dow) {
    // 対象外（免除）
    if (staff.exemptFromDate && dateKey >= staff.exemptFromDate) return true;

    // 公休日
    if (staff.dayOffWeekdays && staff.dayOffWeekdays.includes(dow)) return true;

    // 不可日
    if (staff.unavailableDates && staff.unavailableDates.includes(dateKey)) return true;

    return false;
  }

  /** 時間帯の重なり判定 */
  function isTimeOverlap(startA, endA, startB, endB) {
    // HH:MM形式を分に変換
    const toMin = (t) => {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    };
    const a0 = toMin(startA), a1 = toMin(endA);
    const b0 = toMin(startB), b1 = toMin(endB);
    return a0 < b1 && b0 < a1;
  }

  function exportJSON() {
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const { year, month } = state.calendar;
    a.download = `当番表データ_${year}年${month}月.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('JSONをエクスポートしました');
  }

  function importJSON() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.addEventListener('load', () => {
        try {
          const data = JSON.parse(reader.result);
          // 型まで検証する（配列であるべき項目にオブジェクト等が入った破損stateの保存を防ぐ）
          if (!data.calendar || typeof data.calendar !== 'object' ||
              !Array.isArray(data.slots) || !Array.isArray(data.staff)) {
            showToast('無効なデータ形式です');
            return;
          }
          if (!confirm(`現在のデータを読み込んだ内容（職員${data.staff.length}人）で置き換えます。よろしいですか？`)) return;
          const defaults = createDefaultData();
          state = {
            calendar: { ...defaults.calendar, ...data.calendar },
            slots: data.slots,
            tags: Array.isArray(data.tags) ? data.tags : defaults.tags,
            staff: data.staff,
            assignments: (data.assignments && typeof data.assignments === 'object' && !Array.isArray(data.assignments)) ? data.assignments : defaults.assignments,
            neoIds: (data.neoIds && typeof data.neoIds === 'object' && !Array.isArray(data.neoIds)) ? data.neoIds : defaults.neoIds,
          };
          saveData();
          renderTabs();
          renderActiveTab();
          renderGrid();
          showToast(`インポート完了（職員${state.staff.length}人）`);
        } catch (e) {
          showToast('JSONの読み込みに失敗しました');
          console.error('インポートエラー:', e);
        }
      });
      reader.addEventListener('error', () => {
        showToast('ファイルの読み込みに失敗しました');
      });
      reader.readAsText(file);
    });
    input.click();
  }

  function undoAssignment() {
    if (undoHistory.length === 0) {
      showToast('元に戻す履歴がありません');
      return;
    }
    state.assignments = JSON.parse(undoHistory.pop());
    saveData();
    renderGrid();
    showToast('割り当てを1手戻しました');
  }

  function copyToClipboard() {
    const { year, month } = state.calendar;
    const daysInMonth = getDaysInMonth(year, month);
    const lines = [];

    // ヘッダー行
    const header = ['日付', '曜日', ...state.slots.map(s => s.name)];
    lines.push(header.join('\t'));

    for (let day = 1; day <= daysInMonth; day++) {
      const dow = getDayOfWeek(year, month, day);
      const dateStr = `${month}/${day}`;
      const dowStr = WEEKDAY_NAMES[dow];
      const dateKey = formatDate(year, month, day);

      const cells = [dateStr, dowStr];
      for (const slot of state.slots) {
        const assigned = getAssignmentsForCell(dateKey, slot.id);
        const names = assigned.map(id => {
          const s = state.staff.find(x => x.id === id);
          return s ? s.name : '';
        });
        cells.push(names.join(', '));
      }
      lines.push(cells.join('\t'));
    }

    const text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('クリップボードにコピーしました。Excelに貼り付けてください。');
      }).catch(() => {
        fallbackCopyToClipboard(text);
      });
    } else {
      fallbackCopyToClipboard(text);
    }
  }

  function fallbackCopyToClipboard(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      showToast('クリップボードにコピーしました。Excelに貼り付けてください。');
    } catch (e) {
      showToast('コピーに失敗しました。手動でコピーしてください。');
      console.error('クリップボードコピー失敗:', e);
    } finally {
      document.body.removeChild(textarea);
    }
  }

  function downloadNEOCsv() {
    const { year, month } = state.calendar;
    const daysInMonth = getDaysInMonth(year, month);

    // NEO CSVヘッダー
    const neoHeaders = [
      'ユーザー/グループシステムID', '氏名/グループ名', 'ID（システムID）',
      '開始日', '開始時刻', '終了日', '終了時刻',
      '予定', '予定詳細', '場所', '場所詳細', '内容',
      '情報公開レベル', '外出区分', '重要度', '予約種別',
      '帯状', 'フラグ', 'アイコン番号', '承認依頼', '確認通知メール',
      '所有者ID', '所有者名',
    ];

    const rows = [neoHeaders.join(',')];

    for (let day = 1; day <= daysInMonth; day++) {
      if (!hasAnyActiveSlot(day)) continue;
      const dateKey = formatDate(year, month, day);
      const dateStr = `${year}/${String(month).padStart(2, '0')}/${String(day).padStart(2, '0')}`;

      for (const slot of state.slots) {
        if (!isSlotActiveForDay(slot, day)) continue;
        const assigned = getAssignmentsForCell(dateKey, slot.id);
        for (const staffId of assigned) {
          const staffObj = state.staff.find(s => s.id === staffId);
          if (!staffObj) continue;

          const neoId = state.neoIds[staffId] || '';
          const row = [
            neoId,                    // ユーザーシステムID
            staffObj.name,            // 氏名
            '',                       // ID
            dateStr,                  // 開始日
            slot.startTime,           // 開始時刻
            dateStr,                  // 終了日
            slot.endTime,             // 終了時刻
            slot.name,                // 予定
            '',                       // 予定詳細
            '',                       // 場所
            '',                       // 場所詳細
            '',                       // 内容
            '全員に公開',              // 情報公開レベル
            '社内',                    // 外出区分
            '普通',                    // 重要度
            '予定あり',                // 予約種別
            '0',                      // 帯状
            '0',                      // フラグ
            '0',                      // アイコン番号
            '0',                      // 承認依頼
            '0',                      // 確認通知メール
            '',                       // 所有者ID
            '',                       // 所有者名
          ];

          // CSVエスケープ
          const escaped = row.map(v => {
            const s = String(v);
            if (s.includes(',') || s.includes('"') || s.includes('\n')) {
              return '"' + s.replace(/"/g, '""') + '"';
            }
            return s;
          });
          rows.push(escaped.join(','));
        }
      }
    }

    const csvContent = '\uFEFF' + rows.join('\r\n'); // BOM付きUTF-8
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `当番表_${year}年${month}月_NEO.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('CSVをダウンロードしました');
  }

  // ==========================================================
  // 設定パネル折りたたみ
  // ==========================================================
  function setupSettingsToggle() {
    const toggleHeader = document.getElementById('settings-toggle');
    const toggleIcon = document.getElementById('settings-toggle-icon');
    const body = document.getElementById('settings-body');

    toggleHeader.addEventListener('click', () => {
      const isCollapsed = body.classList.toggle('collapsed');
      toggleIcon.classList.toggle('collapsed', isCollapsed);
    });
  }

  // ==========================================================
  // 初期化
  // ==========================================================
  function init() {
    setupSettingsToggle();

    // モーダルオーバーレイのクリックイベントを一度だけ登録（リスナー累積防止）
    const overlay = document.getElementById('modal-overlay');
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        if (modalCloseGuard && !confirm(modalCloseGuard)) return;
        closeModal();
        renderGrid();
      }
    });

    renderTabs();
    renderActiveTab();
    renderGrid();
    renderOutputArea();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
