<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>Udemyもくもく会 ダッシュボード（オンライン vs 会場）- FIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #e0f2fe 0, #f8fafc 55%, #e5e7eb 100%);
            color: #0f172a;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }

        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.06);
        }
    </style>
</head>

<body>
    <!-- タイトル / 概要 (TOP LEVEL) -->
    <section class="widget glass rounded-2xl p-6 mb-6" data-id="header-summary" data-type="summary-text"
        style="width: 1000px;">
        <h1 class="text-2xl font-bold text-slate-900">
            Udemyもくもく会 ダッシュボード（オンライン vs 会場）
        </h1>
        <p class="mt-2 text-slate-600">
            「どれだけ集中できたか」をオンラインと会場で比較した至高のレポートです。
        </p>
    </section>

    <!-- KPI (TOP LEVEL) -->
    <section class="widget glass rounded-2xl p-6" data-id="kpi-focus-by-mode" data-type="decision-kpi"
        style="width: 480px; top: 180px; left: 20px;">
        <h2 class="text-sm font-semibold text-sky-800 mb-4">集中できた率</h2>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-emerald-50 p-4 rounded-xl">
                <span class="text-xs text-emerald-800">会場</span>
                <p class="text-3xl font-bold text-emerald-700">100%</p>
            </div>
            <div class="bg-sky-50 p-4 rounded-xl">
                <span class="text-xs text-sky-800">オンライン</span>
                <p class="text-3xl font-bold text-sky-700">71.4%</p>
            </div>
        </div>
    </section>

    <script>
        // ツールでの読み込み後は stabilization logic が走ります
    </script>
</body>

</html>
