<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>完了一覧 — Neuro Matrix Task OS</title>

  <script src="../assets/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: 'var(--bg)', surface: 'var(--surface)', 'surface-hover': 'var(--surface-hover)', 'surface-2': 'var(--surface-2)', 'surface-3': 'var(--surface-3)',
            border: 'var(--border)', 'border-muted': 'var(--border-muted)',
            'text-0': 'var(--text-0)', 'text-1': 'var(--text-1)', 'text-2': 'var(--text-2)', 'text-3': 'var(--text-3)',
            q1: 'var(--q1)', q2: 'var(--q2)', q3: 'var(--q3)', q4: 'var(--q4)', accent: 'var(--accent)',
          },
          fontFamily: { sans: ['Inter', 'Noto Sans JP', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../assets/styles.css">
</head>

<body class="bg-bg text-text-0 font-sans antialiased h-screen overflow-hidden">
<div class="h-screen flex flex-col">

  <!-- TopBar -->
  <header class="app-topbar h-12 flex-shrink-0 flex items-center gap-3 px-4 z-30">
    <a href="../index.html" class="flex items-center gap-2 pr-4 border-r border-border-muted mr-1 no-underline">
      <span class="material-symbols-outlined text-q1" style="font-variation-settings: 'FILL' 1, 'wght' 600;">change_history</span>
      <span class="font-bold tracking-tight text-text-0">NEURO<span class="text-q1">.</span>MATRIX</span>
    </a>
    <button id="quick-add-btn" class="group flex items-center gap-2 px-3 h-8 bg-surface-2 hover:bg-surface-3 rounded-md text-text-1 hover:text-text-0 transition-colors" title="キーボード N で新規タスク追加（実装予定）">
      <span class="material-symbols-outlined text-base">add</span>
      <span class="text-sm font-medium">新規タスク</span>
      <kbd class="ml-2 px-1.5 py-0.5 rounded bg-bg/60 border border-border-muted text-[10px] font-mono text-text-3 group-hover:text-text-2">N</kbd>
    </button>
    <div class="flex-1"></div>
    <a href="settings.html#appearance" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-surface-2 text-text-2 hover:text-text-0 transition-colors no-underline" aria-label="テーマ設定" title="設定で変更">
      <span class="material-symbols-outlined text-lg">dark_mode</span>
    </a>
    <a href="survival.html" id="survival-btn" class="flex items-center gap-1.5 h-8 px-3 rounded-md no-underline">
      <span class="material-symbols-outlined text-base" style="font-variation-settings: 'FILL' 1;">bolt</span>
      <span class="text-sm font-semibold tracking-wide">SURVIVAL</span>
    </a>
    <div class="w-8 h-8 rounded-full bg-surface-2 border border-border text-text-1 flex items-center justify-center text-xs font-bold ml-1">T</div>
  </header>

  <div class="flex-1 flex overflow-hidden min-h-0">

    <!-- Sidebar -->
    <aside class="app-sidebar w-60 flex-shrink-0 flex flex-col">
      <nav class="flex-1 px-2 py-3 space-y-0.5 overflow-y-auto">
        <div class="px-2 pb-1.5 text-[10px] font-semibold tracking-widest text-text-3 uppercase">Workspace</div>
        <a href="../index.html" class="nav-item"><span class="material-symbols-outlined text-[20px]">dashboard</span><span>ダッシュボード</span></a>
        <a href="survival.html" class="nav-item text-q1"><span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">bolt</span><span>サバイバル</span></a>
        <a href="completed.html" class="nav-item active"><span class="material-symbols-outlined text-[20px]">done_all</span><span>完了一覧</span><span class="ml-auto text-[11px] font-mono text-text-3" data-sidebar-count="completed">0</span></a>

        <div class="pt-4 px-2 pb-1.5 text-[10px] font-semibold tracking-widest text-text-3 uppercase">Views</div>
        <a href="today.html" class="nav-item"><span class="material-symbols-outlined text-[20px]">today</span><span>今日</span><span class="ml-auto text-[11px] font-mono text-text-3" data-sidebar-count="today">0</span></a>
        <a href="overdue.html" class="nav-item"><span class="material-symbols-outlined text-[20px]">event_busy</span><span>期限超過</span><span class="ml-auto text-[11px] font-mono text-text-3" data-sidebar-count="overdue">0</span></a>

      </nav>
      <div class="border-t border-border-muted p-2 space-y-0.5">
        <a href="settings.html#export" class="nav-item"><span class="material-symbols-outlined text-[20px]">download</span><span>JSON書出</span></a>
        <a href="settings.html#import" class="nav-item"><span class="material-symbols-outlined text-[20px]">upload</span><span>JSON取込</span></a>
        <a href="settings.html" class="nav-item"><span class="material-symbols-outlined text-[20px]">settings</span><span>設定</span></a>
      </div>
    </aside>


    <!-- Main — Completed list -->
    <main class="flex-1 overflow-hidden flex flex-col bg-bg">

      <!-- Page header -->
      <div class="flex-shrink-0 px-8 pt-6 pb-4 border-b border-border-muted bg-surface">
        <div class="flex items-start justify-between gap-6">
          <div>
            <div class="flex items-center gap-2 text-text-2 text-xs font-mono tracking-widest uppercase mb-1">
              <span class="material-symbols-outlined text-[16px]">done_all</span>
              <span>Archive</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-text-0">完了済みタスク</h1>
            <p class="text-sm text-text-2 mt-1">何を、いつ終えたかを見返せる</p>
          </div>

          <div class="flex items-center gap-3">
            <!-- Stats -->
            <div class="flex items-center gap-5 pr-5 border-r border-border-muted">
              <div class="text-right">
                <div class="text-[10px] font-mono tracking-widest text-text-3 uppercase">This week</div>
                <div class="text-xl font-bold font-mono text-text-0"><span data-stat="this-week">0</span><span class="text-sm text-text-2 font-normal">件</span></div>
              </div>
              <div class="text-right">
                <div class="text-[10px] font-mono tracking-widest text-text-3 uppercase">Total</div>
                <div class="text-xl font-bold font-mono text-text-0"><span data-stat="total">0</span><span class="text-sm text-text-2 font-normal">件</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Completed list -->
      <div id="completed-list" class="flex-1 overflow-y-auto px-8 py-6"></div>
    </main>
  </div>

  <!-- StatusBar -->
  <footer class="app-statusbar h-7 flex-shrink-0 px-4 flex items-center justify-between text-[11px] font-mono">
    <div class="flex items-center gap-4">
      <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-q2"></span>11 active</span>
      <span>/ 12 completed</span>
    </div>
    <div class="flex items-center gap-4">
      <span>オフラインモード</span>
      <kbd>?</kbd>
      <span>shortcuts</span>
    </div>
  </footer>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
