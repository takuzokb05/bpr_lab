<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SURVIVAL MODE — Neuro Matrix Task OS</title>

  <script src="../assets/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'panic-bg':   '#050505',
            'panic-ink':  '#e8e8e8',
            'panic-dim':  '#8a8a8a',
            'neon-red':    '#ff2d4a',
            'neon-yellow': '#ffe347',
            'neon-cyan':   '#3df0ff',
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            cyber: ['Orbitron', 'monospace'],
          },
        }
      }
    }
  </script>

  <style>
    body { background: #050505; color: #e8e8e8; font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    .scanlines {
      background: linear-gradient(rgba(255,255,255,0.04) 50%, transparent 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }
    .slash-pattern {
      background-image: repeating-linear-gradient(45deg, #000, #000 12px, #1a0505 12px, #1a0505 24px);
    }
    .text-glow-red   { text-shadow: 0 0 8px #ff2d4a, 0 0 18px rgba(255,45,74,.55); }
    .text-glow-cyan  { text-shadow: 0 0 8px #3df0ff, 0 0 16px rgba(61,240,255,.5); }
    .text-glow-white { text-shadow: 0 0 12px rgba(255,255,255,.4), 0 0 24px rgba(255,255,255,.15); }
    .border-glow-red    { box-shadow: 0 0 24px rgba(255,45,74,.35), inset 0 0 12px rgba(255,45,74,.15); border-color: #ff2d4a; }
    .border-glow-yellow { box-shadow: 0 0 24px rgba(255,227,71,.3),  inset 0 0 12px rgba(255,227,71,.12); border-color: #ffe347; }
    .border-glow-cyan   { box-shadow: 0 0 18px rgba(61,240,255,.3),  inset 0 0 10px rgba(61,240,255,.12); border-color: #3df0ff; }
    .timer-pulse { animation: pulse-critical 1.2s ease-in-out infinite; }
    @keyframes pulse-critical { 0%,100% { opacity: 1; } 50% { opacity: .72; } }
    .bg-noise {
      background-image:
        radial-gradient(ellipse at top, rgba(255,45,74,.08) 0%, transparent 60%),
        radial-gradient(ellipse at bottom, rgba(61,240,255,.05) 0%, transparent 60%);
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a2a2a; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'opsz' 24; vertical-align: middle; user-select: none; line-height: 1; }
  </style>
</head>

<body class="h-screen overflow-hidden antialiased">

<!-- Scanline overlay (fixed) -->
<div class="fixed inset-0 scanlines z-50"></div>

<div class="h-screen flex flex-col relative bg-noise">

  <!-- ════════ Hazard Header ════════ -->
  <header class="relative flex-shrink-0 slash-pattern border-b-2 border-neon-red overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-black/40"></div>
    <div class="relative flex items-center justify-between px-8 py-5">
      <div class="flex items-center gap-4">
        <span class="material-symbols-outlined text-neon-red text-4xl timer-pulse" style="font-variation-settings: 'FILL' 1;">warning</span>
        <div>
          <div class="flex items-center gap-2 mb-1 opacity-60">
            <span class="material-symbols-outlined text-neon-red/70 text-sm" style="font-variation-settings: 'FILL' 1, 'wght' 600;">change_history</span>
            <span class="font-mono text-[10px] tracking-[0.3em] uppercase text-neon-red/70">NEURO.MATRIX</span>
          </div>
          <h1 class="font-cyber font-black text-2xl tracking-widest uppercase text-neon-red text-glow-red leading-none">緊急モード起動中</h1>
          <div class="font-mono text-[10px] tracking-[0.4em] text-neon-cyan text-glow-cyan mt-1.5 uppercase">締切まで集中モード</div>
        </div>
      </div>
      <div class="flex items-center gap-6 font-mono text-[11px] text-neon-cyan/80">
        <div class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-neon-cyan animate-pulse"></span>
          <span class="tracking-widest">SYS.REQ // OVERRIDE</span>
        </div>
        <a href="../index.html" class="text-panic-dim hover:text-panic-ink transition-colors tracking-wider">← NORMAL MODE</a>
      </div>
    </div>
  </header>


  <!-- ════════ Main content ════════ -->
  <main class="flex-1 overflow-hidden flex flex-col lg:flex-row gap-8 p-8 relative">

    <!-- ── Left: Countdown ── -->
    <section class="flex-1 flex flex-col items-center justify-center relative">

      <!-- Soft radial glow behind timer -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-[480px] h-[480px] rounded-full bg-neon-red/5 blur-3xl"></div>
      </div>

      <div class="relative flex flex-col items-center">
        <div class="font-mono text-[10px] tracking-[0.4em] text-neon-cyan text-glow-cyan uppercase mb-3">TIME REMAINING UNTIL <span id="countdown-target">17:30</span></div>
        <div id="countdown" class="font-cyber font-black text-[8rem] leading-none text-neon-red text-glow-red timer-pulse tracking-tight">--:--</div>
        <div class="flex items-center gap-4 mt-6 font-mono text-xs">
          <div class="flex items-center gap-2 text-neon-yellow" id="countdown-status">
            <span class="w-2 h-2 rounded-full bg-neon-yellow animate-pulse"></span>
            <span class="tracking-widest">HH:MM</span>
          </div>
          <span class="text-panic-dim">/</span>
          <div class="flex items-center gap-2 text-panic-dim">
            <span class="tracking-widest">TARGET <span id="target-label">17:30</span></span>
          </div>
        </div>

        <!-- Target time input -->
        <div class="mt-8 flex items-center gap-3">
          <label for="target-time" class="font-mono text-[10px] tracking-[0.3em] uppercase text-panic-dim">DEADLINE</label>
          <input type="time" id="target-time" value="17:30"
            class="bg-black border border-neon-red/40 text-neon-red font-mono font-bold px-3 py-2 rounded outline-none focus:border-neon-red focus:shadow-[0_0_12px_rgba(255,45,74,0.3)]">
        </div>
      </div>
    </section>


    <!-- ── Right: Slots ── -->
    <section class="w-full lg:w-[480px] flex flex-col gap-6 flex-shrink-0">

      <!-- MUST slot -->
      <div class="border-2 border-glow-red rounded bg-black/60 p-5 relative" data-drop-zone="slot-must">
        <div class="absolute top-0 left-0 w-1 h-full bg-neon-red"></div>
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-neon-red text-[20px]" style="font-variation-settings: 'FILL' 1;">error</span>
            <h2 class="font-mono font-bold text-neon-red tracking-[0.2em] text-xs uppercase">MUST · 今日やる</h2>
          </div>
          <span class="font-mono text-neon-red/70 text-xs tracking-widest" data-survival-count="slot-must">0/2</span>
        </div>
        <div id="slot-must" data-zone-body="slot-must" class="flex flex-col gap-2 min-h-[80px]"></div>
      </div>

      <!-- SHOULD slot -->
      <div class="border-2 border-glow-yellow rounded bg-black/60 p-5 relative" data-drop-zone="slot-should">
        <div class="absolute top-0 left-0 w-1 h-full bg-neon-yellow"></div>
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-neon-yellow text-[20px]" style="font-variation-settings: 'FILL' 1;">schedule</span>
            <h2 class="font-mono font-bold text-neon-yellow tracking-[0.2em] text-xs uppercase">SHOULD · できたら</h2>
          </div>
          <span class="font-mono text-neon-yellow/70 text-xs tracking-widest" data-survival-count="slot-should">0/3</span>
        </div>
        <div id="slot-should" data-zone-body="slot-should" class="flex flex-col gap-2 min-h-[80px]"></div>
      </div>
    </section>
  </main>


  <!-- ════════ Bottom: Picker strip ════════ -->
  <footer class="flex-shrink-0 border-t border-neon-cyan/20 bg-black/80 backdrop-blur-md px-8 py-5 relative">
    <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-neon-cyan/50 to-transparent"></div>

    <div class="flex items-center gap-4 mb-3">
      <span class="material-symbols-outlined text-neon-cyan text-[18px]">inventory_2</span>
      <span class="font-mono text-[10px] tracking-[0.3em] uppercase text-neon-cyan text-glow-cyan">未割り当て — 上のスロットにドラッグして決める</span>
      <div class="flex-1 h-px bg-neon-cyan/10"></div>
      <span class="font-mono text-[10px] text-panic-dim tracking-widest" data-survival-count="survival-picker">0 PENDING</span>
    </div>

    <div id="survival-picker" data-zone-body="survival-picker" data-drop-zone="survival-picker" class="flex gap-3 overflow-x-auto pb-2 min-h-[96px]">
      <!-- 動的に描画 -->
    </div>

    <!-- Exit -->
    <div class="flex items-center justify-between mt-4 pt-4 border-t border-neon-cyan/10">
      <div class="flex items-center gap-2 text-panic-dim font-mono text-[10px] tracking-widest">
        <kbd class="px-2 py-0.5 rounded bg-black border border-neon-cyan/25 text-neon-cyan/70">ESC</kbd>
        <span>to exit</span>
      </div>
      <a href="../index.html" id="exit-survival" class="inline-flex items-center gap-2 bg-transparent border border-white/25 hover:border-white/50 hover:bg-white/5 text-white font-mono font-bold uppercase tracking-[0.2em] text-xs px-6 py-3 rounded transition-colors no-underline">
        <span class="material-symbols-outlined text-[16px]">logout</span>
        通常モードへ戻る
      </a>
    </div>
  </footer>

</div>
<script src="../assets/app.js"></script>
</body>
</html>
