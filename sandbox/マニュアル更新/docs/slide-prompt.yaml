# NotebookLM スライド生成プロンプト
#
# 使い方:
#   1. NotebookLMに提案書v2(proposal-v2.md)と背景資料(AIハブ構想の背景.docx)をソースとして投入
#   2. 以下のプロンプトをチャットに貼り付ける
#   3. 生成されたスライド構成を確認し、必要に応じて調整を依頼

target: 係長・課長（IT部門ではなく事業部門の管理職）
tone: 堅すぎず、でも軽すぎず。現場感のある言葉で。
constraint: 技術用語（RAG、LLM等）はできるだけ避け、使う場合は一言で説明を添える

prompt: |
  アップロードした資料をもとに、庁内説明用のスライド構成を作ってください。

  ■ 対象者
  係長・課長クラス。ITに詳しくない。
  「なぜこれが必要なのか」が腹落ちすることが最優先。

  ■ スライドの構成方針
  前半で「なぜ」を丁寧に掘り下げ、後半で「どうする」を簡潔に。
  Whyに7割、Howに3割くらいの配分で。15枚程度。

  ■ スライド構成

  === 第1部: なぜこの構想が必要なのか ===

  スライド1: タイトル
    - 「育てるマニュアル」構想
    - サブタイトル: 指定管理者との制度運用を、もっと良くするために

  スライド2: 制度運用の全体像
    - 共用部分代行管理制度の構造をシンプルに図示
    - 市がマニュアルを作り、指定管理者事務所が住民対応を担う
    - 事務所は日常的に多くの判断を求められている
    - ※ 制度の前提知識を共有するためのスライド

  スライド3: マニュアルの今の運用
    - 市が作成 → 年1回改訂 → 事務所に送付
    - 一方向型。事務所からのフィードバック回路がない
    - 図: 市→→→事務所（矢印が一方向だけ）

  スライド4: 事務所の現場で起きていること
    - 住民が目の前で困っている。その場で判断しなければならない
    - 一つ一つ市に電話で確認するのは時間的・心理的ハードルが高い
    - マニュアルの記載が分かりにくい部分は、経験に基づいて判断している
    - ※ 事務所を責めるトーンにしない。「現場は頑張っている」というニュアンス

  スライド5: なぜ「認識のずれ」が起きるのか
    - マニュアルの記載が抽象的な部分がある
    - 現場の実情に即していない表現がある
    - 実務で迷いやすい判断ポイントが、事務所の解釈に委ねられている
    - → これはマニュアルの書き方だけの問題ではなく、構造の問題
    - ※ 「マニュアルが悪い」でも「事務所が悪い」でもないことを明示

  スライド6: 市が気づけない構造
    - 事務所がどんな質問を受け、どう判断しているか、市には見えない
    - トラブル・苦情・外部指摘で初めて「対応がずれていた」と気づく
    - 表面化していないだけで、本来と異なる対応は相当数あるのではないか
    - ※ ここが相談者が一番伝えたい危機感

  スライド7: 双方にとっての不利益
    - 事務所: 迷いながら対応せざるを得ない。後から「対応が違う」と言われるリスク
    - 市: 制度が意図通りに運用されているか把握できない。事後対応になりがち
    - 一言: 「事務所の努力不足ではない。確認する手段と、声が届く仕組みがない」

  スライド8: 問題の本質
    - マニュアルの出来不出来ではなく、マニュアルが現場と切り離されている構造
    - 図: フィードバックが返らないループ
      市→マニュアル作成→送付→事務所→現場判断→ズレ蓄積→(市に届かない)→市
    - この構造を変えない限り、マニュアルを書き直しても同じことが繰り返される

  スライド9: 他の手段ではなぜ足りないのか
    - メール・チャット窓口の新設 → 市の対応負荷が増えるだけ。回答にタイムラグ
    - マニュアルの全面改訂 → 今は良くなるが、時間が経てば再び乖離する
    - 定期研修・勉強会 → 全事務所に均一に実施が難しい。人が変わればリセット
    - → どれも「一時的な改善」であり「構造の転換」ではない

  === 第2部: どう変えるか ===

  スライド10: 目指す姿
    - 「配るマニュアル」から「育てるマニュアル」へ
    - 事務所が気軽に確認でき、そのやり取りが蓄積され、マニュアルが育っていく循環
    - 図: 事務所→AI→市の双方向フロー（質問→回答→蓄積→改善→精度向上）

  スライド11: 仕組みの概要
    - 事務所がAIに質問 → マニュアルに基づいて即時回答
    - AIで判断できない → 市に確認依頼 → 市が回答・承認 → 知識に追加
    - 質問ログが蓄積 → どこで迷うかが可視化 → マニュアル改善の根拠に
    - ※ 技術の説明ではなく「情報の流れ」として描く

  スライド12: すでに横浜市で実績がある
    - 選挙管理事務で同様のAI実証を実施済み（4,500ページ、回答精度9割）
    - 全国: 指定都市の90%が生成AIを導入済み
    - 新しい冒険ではなく、横浜市がすでに歩み始めている道の延長線上

  スライド13: 進め方 — 小さく試して、手応えを見てから
    - まず: 現場調査（事務所の困りごと・質問パターンの棚卸し）
    - 次に: 実際のマニュアルでAIの回答精度をテスト
    - その上で: 協力事務所1〜2箇所でパイロット
    - 成果が出れば: 本格導入に向けた検討へ
    - ※ 「一足飛びにやらない」「駄目なら止められる」安心感を出す

  スライド14: 事務所との向き合い方
    - これは監視のツールではない
    - 事務所が蓄積してきた現場の知見を、マニュアルに取り込む橋渡し
    - 質問ログは制度改善のために使う。事務所の評価には使わない
    - 全事務所一斉ではなく、前向きな事務所からスモールスタート
    - ※ このスライドがないと「事務所が反発するのでは」と突っ込まれる

  スライド15: 次のアクション
    - まずは現場調査から始めたい
    - 調査段階では費用は発生しない
    - お願い: 事務所訪問の了承
    - この調査の結果を踏まえて、次のステップを改めてご相談します

  ■ デザイン指示
  - 1スライドにキーメッセージ1つ。補足は2〜3行まで
  - 第1部（Why）のスライドは、文字よりも図・構造・対比で伝える
  - フロー図は矢印の向きで「一方向 vs 双方向」の違いを視覚的に
  - 色使いは落ち着いたトーン（自治体の資料として違和感がないもの）
  - フォントは大きめ（会議室の後ろからでも読める想定）
  - スライド7（双方の不利益）は対比レイアウトで左右に分ける
  - スライド8（問題の本質）はこのプレゼンの最重要スライド。一番印象に残るデザインに

  ■ 避けてほしいこと
  - 技術用語の羅列（RAG、LLM、LGWAN等は最小限に。使う場合は括弧で一言説明）
  - 事務所を問題の原因として描くこと
  - 「AI導入の提案」という見せ方（構造転換の提案であり、AIはその手段）
  - コスト金額の記載（この段階では不要）
  - 過度に楽観的な効果予測（「9割の精度が出ます」ではなく「テストで確認します」）
  - スライド1枚に情報を詰め込むこと
