# Kindle Auto-Capture ツールの開発設定（lint / typecheck / test）

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
# E/F/W: pycodestyle+pyflakes基本, B: bugbear(バグりやすいイディオム), UP: モダン構文
select = ["E", "F", "W", "B", "UP"]
# 既存コードはcamelCase契約のためN(命名)は有効化しない
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
# GUIオートメーション系ライブラリは型スタブ未提供のため
ignore_missing_imports = true
exclude = ["\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
